<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전화 지급 신청 — 이앤원 여주물류센터</title>
<style>
:root{--orange:#ff6b35;--navy:#1a2744;--bg:#f8f9fa;--white:#fff;--border:#e2e8f0;--text:#2d3748;--muted:#718096;--green:#38a169;--red:#e53e3e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
.header{background:var(--navy);padding:18px 20px 14px;color:white;text-align:center;}
.header-title{font-size:18px;font-weight:800;letter-spacing:-.02em;}
.header-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:4px;}
.container{max-width:560px;margin:0 auto;padding:16px;}
.notice{background:#fff8f0;border:1px solid #fbbf7a;border-radius:10px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:14px;line-height:1.7;}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.card-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.form-row{margin-bottom:10px;}
.form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.f-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;display:block;}
.f-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);transition:.15s;}
.f-input:focus{outline:none;border-color:var(--orange);background:var(--white);}
select.f-input{cursor:pointer;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:#f7f8fa;padding:8px 6px;text-align:left;font-weight:700;color:var(--navy);border-bottom:2px solid var(--border);font-size:11px;}
.tbl td{padding:5px 4px;border-bottom:1px solid #f0f0ec;vertical-align:middle;}
.t-name{width:100%;padding:8px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
.t-name:focus{outline:none;border-color:var(--orange);}
.t-size{width:100%;padding:8px 4px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;}
.t-size:focus{outline:none;border-color:var(--orange);}
.btn-del{background:none;border:none;color:#ccc;cursor:pointer;padding:4px 8px;font-size:18px;line-height:1;transition:.15s;}
.btn-del:hover{color:var(--red);}
.btn-add-row{width:100%;margin-top:10px;padding:9px;background:#f7f8fa;border:1.5px dashed var(--border);border-radius:8px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
.btn-add-row:hover{border-color:var(--orange);color:var(--orange);background:#fff8f5;}
.btn-submit{width:100%;padding:14px;background:var(--orange);color:white;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;margin-top:4px;}
.btn-submit:hover{opacity:.9;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.success{text-align:center;padding:40px 20px;}
.s-icon{font-size:56px;margin-bottom:14px;}
.s-title{font-size:20px;font-weight:800;color:var(--green);margin-bottom:8px;}
.s-msg{font-size:13px;color:var(--muted);line-height:1.8;}
.btn-again{width:100%;padding:12px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text);margin-top:12px;}
.btn-again:hover{border-color:var(--orange);color:var(--orange);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🛡️ 안전화 지급 신청</div>
  <div class="header-sub">이앤원(주) 여주물류센터 — 이마트 여주DC</div>
</div>

<div class="container">

  <!-- 폼 영역 -->
  <div id="formView">
    <div class="notice">
      ※ 매월 <b>23일까지</b> 신청 바랍니다<br>
      ※ 이름과 사이즈를 정확히 입력해 주세요<br>
      ※ 문의: 안전관리자 이현수 (031-887-5154)
    </div>

    <!-- 팀장 정보 -->
    <div class="card">
      <div class="card-title">신청자 정보</div>
      <div class="form-row two">
        <div>
          <label class="f-label">팀장 성명 *</label>
          <input class="f-input" id="managerName" placeholder="홍길동" maxlength="10">
        </div>
        <div>
          <label class="f-label">신청일</label>
          <input class="f-input" id="submitDate" readonly style="background:#f0f4ff;color:#1a2744;font-weight:700;cursor:default;">
        </div>
      </div>
      <div class="form-row two">
        <div>
          <label class="f-label">파트 *</label>
          <select class="f-input" id="managerPart">
            <option value="">파트 선택</option>
            <option>DRY</option><option>WET</option><option>ED</option><option>기타(지원)</option>
          </select>
        </div>
        <div>
          <label class="f-label">직무(조) *</label>
          <select class="f-input" id="managerJob">
            <option value="">직무 선택</option>
            <option>1조</option><option>2조</option><option>3조</option>
            <option>4조</option><option>5조</option><option>6조</option>
            <option>DAS</option><option>ED</option><option>DPS</option>
            <option>운영</option><option>소터</option><option>입하</option><option>출하</option>
            <option>기타(지원)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 신청 인원 -->
    <div class="card">
      <div class="card-title">신청 인원 목록</div>
      <table class="tbl">
        <thead>
          <tr>
            <th style="width:32px;text-align:center">No</th>
            <th>성명</th>
            <th style="width:100px">사이즈</th>
            <th style="width:32px"></th>
          </tr>
        </thead>
        <tbody id="memberRows"></tbody>
      </table>
      <button class="btn-add-row" onclick="addRow()">+ 인원 추가</button>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitRequest()">신청 제출</button>
  </div>

  <!-- 완료 영역 -->
  <div id="successView" style="display:none">
    <div class="card">
      <div class="success">
        <div class="s-icon">✅</div>
        <div class="s-title">신청이 접수되었습니다</div>
        <div class="s-msg" id="successMsg"></div>
      </div>
    </div>
    <button class="btn-again" onclick="resetForm()">다시 신청하기</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBAIDe5hiSLcnkGHQfemYBllsP5RjGLU1o",
  authDomain: "safety-health-e01d0.firebaseapp.com",
  projectId: "safety-health-e01d0",
  storageBucket: "safety-health-e01d0.firebasestorage.app",
  messagingSenderId: "856619039928",
  appId: "1:856619039928:web:1ec59934904decb328c84d",
  databaseURL: "https://safety-health-e01d0-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const fbDB = firebase.database();

const SIZES = [230,235,240,245,250,255,260,265,270,275,280,285,290,295,300];
let rowCount = 0;

function addRow(name='', size='') {
  rowCount++;
  const n = rowCount;
  const tbody = document.getElementById('memberRows');
  const tr = document.createElement('tr');
  tr.id = 'row_' + n;
  tr.innerHTML = `
    <td style="text-align:center;color:#999;font-size:12px;font-weight:700;">${n}</td>
    <td><input class="t-name" type="text" placeholder="이름" value="${name}" maxlength="10"></td>
    <td>
      <select class="t-size">
        <option value="">-</option>
        ${SIZES.map(s=>`<option value="${s}"${String(s)===String(size)?'selected':''}>${s}mm</option>`).join('')}
      </select>
    </td>
    <td><button class="btn-del" onclick="removeRow('row_${n}')" title="삭제">×</button></td>
  `;
  tbody.appendChild(tr);
}

function removeRow(id) {
  const el = document.getElementById(id);
  if(el) el.remove();
}

// 신청일 자동 기재
const today = new Date();
document.getElementById('submitDate').value =
  `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;

// 초기 3행
addRow(); addRow(); addRow();

async function submitRequest() {
  const managerName = document.getElementById('managerName').value.trim();
  const part = document.getElementById('managerPart').value;
  const job  = document.getElementById('managerJob').value;

  if(!managerName){ showToast('팀장 성명을 입력해 주세요'); return; }
  if(!part){ showToast('파트를 선택해 주세요'); return; }
  if(!job){ showToast('직무(조)를 선택해 주세요'); return; }

  const rows = document.querySelectorAll('#memberRows tr');
  const items = [];
  rows.forEach(tr => {
    const name = tr.querySelector('input')?.value.trim();
    const size = tr.querySelector('select')?.value || '';
    if(name) items.push({ name, size });
  });

  if(!items.length){ showToast('신청 인원을 최소 1명 입력해 주세요'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '제출 중...';

  const now = new Date();
  const yyyymm = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}`;

  try {
    await fbDB.ref(`prot_requests/${yyyymm}`).push({
      managerName, part, job, items,
      submittedAt: now.toISOString(),
      count: items.length,
      status: 'pending'
    });

    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
    document.getElementById('successMsg').innerHTML =
      `<b>${managerName}</b> 팀장 · <b>${part} ${job}</b><br>` +
      `총 <b>${items.length}명</b> 신청 완료<br><br>` +
      `<span style="font-size:11px;color:#9ca3af;">안전관리자가 매월 23일 전후로 처리합니다</span>`;
  } catch(e) {
    showToast('제출 실패: ' + e.message);
    btn.disabled = false;
    btn.textContent = '신청 제출';
  }
}

function resetForm() {
  document.getElementById('formView').style.display = 'block';
  document.getElementById('successView').style.display = 'none';
  document.getElementById('managerName').value = '';
  document.getElementById('managerPart').value = '';
  document.getElementById('managerJob').value = '';
  document.getElementById('memberRows').innerHTML = '';
  rowCount = 0;
  addRow(); addRow(); addRow();
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '신청 제출';
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
