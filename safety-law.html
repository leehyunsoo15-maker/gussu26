<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산업안전보건법 검색기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1a3a5c; --primary-light: #2d5f8a; --accent: #e8500a;
  --bg: #f4f6f8; --card: #ffffff; --text: #1a1a2e;
  --text-sub: #5a6a7a; --border: #dde3ea; --success: #0a7c4e; --radius: 10px;
}
body { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
header { background:var(--primary); color:white; padding:0 24px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.2); }
.header-inner { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:60px; }
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:white; }
.logo-text { font-size:15px; font-weight:700; }
.logo-sub { font-size:11px; opacity:0.65; margin-top:1px; }
.header-badge { font-size:11px; background:rgba(255,255,255,0.15); padding:4px 10px; border-radius:20px; color:rgba(255,255,255,0.85); }
main { max-width:900px; margin:0 auto; padding:28px 20px; }
.claude-key-area { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.claude-key-area label { font-size:12px; color:var(--text-sub); white-space:nowrap; }
.claude-key-area input { flex:1; height:36px; border:1px solid var(--border); border-radius:8px; padding:0 12px; font-size:13px; outline:none; background:var(--bg); }
.claude-key-area input:focus { border-color:var(--primary-light); }
.claude-key-area .hint { font-size:11px; color:#bbb; white-space:nowrap; }
.search-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:20px; }
.law-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.law-tab { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text-sub); transition:all 0.15s; white-space:nowrap; }
.law-tab:hover { border-color:var(--primary-light); color:var(--primary); }
.law-tab.active { background:var(--primary); color:white; border-color:var(--primary); }
.search-row { display:flex; gap:10px; }
.search-input { flex:1; height:50px; border:1.5px solid var(--border); border-radius:10px; padding:0 18px; font-size:16px; color:var(--text); outline:none; transition:border-color 0.2s; background:white; }
.search-input:focus { border-color:var(--primary); }
.search-btn { height:50px; padding:0 28px; background:var(--primary); color:white; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; transition:background 0.15s; white-space:nowrap; }
.search-btn:hover { background:var(--primary-light); }
.search-btn:active { transform:scale(0.98); }
.example-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.ex-tag { font-size:12px; padding:4px 12px; border-radius:14px; background:#eef2f7; color:var(--text-sub); cursor:pointer; border:none; transition:all 0.15s; }
.ex-tag:hover { background:var(--primary); color:white; }
.result-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.result-count { font-size:13px; color:var(--text-sub); }
.result-count strong { color:var(--primary); }
.result-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:12px; transition:box-shadow 0.2s; }
.result-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.08); }
.result-top { display:flex; align-items:flex-start; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.badge-law { font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; white-space:nowrap; }
.badge-blue { background:#e3edf9; color:#1a3a5c; }
.badge-red { background:#fdeee8; color:#b03a0f; }
.badge-origin { font-size:11px; padding:3px 8px; border-radius:12px; background:#e8f5ee; color:#0a7c4e; font-weight:600; }
.article-title { font-size:15px; font-weight:700; color:var(--primary); flex:1; min-width:200px; }
.article-content { font-size:14px; line-height:1.9; color:var(--text); border-top:1px solid var(--border); padding-top:14px; white-space:pre-wrap; word-break:keep-all; }
.result-footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; flex-wrap:wrap; gap:8px; }
.source-info { font-size:11px; color:#aaa; }
.source-info a { color:#aaa; text-decoration:underline; }
.law-link { font-size:12px; color:var(--primary-light); text-decoration:none; display:flex; align-items:center; gap:4px; font-weight:500; }
.law-link:hover { text-decoration:underline; }
.ai-box { background:#fffbf5; border:1px solid #f5dfc0; border-radius:8px; padding:14px 16px; margin-top:14px; }
.ai-box-header { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.badge-ai { font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:#fdeee8; color:#b03a0f; }
.badge-caution { font-size:11px; color:#b03a0f; }
.ai-content { font-size:13px; line-height:1.75; color:var(--text); }
.ai-btn { font-size:12px; padding:5px 14px; border-radius:8px; border:1px solid #f5dfc0; background:#fffbf5; color:#b03a0f; cursor:pointer; font-weight:600; transition:all 0.15s; }
.ai-btn:hover { background:#fdeee8; }
.state-msg { text-align:center; padding:60px 20px; color:var(--text-sub); }
.state-msg .icon { font-size:40px; margin-bottom:12px; }
.state-msg p { font-size:14px; line-height:1.6; }
.loading { display:flex; align-items:center; justify-content:center; gap:8px; padding:50px; color:var(--text-sub); font-size:14px; }
.spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
footer { text-align:center; padding:24px; font-size:11px; color:#bbb; border-top:1px solid var(--border); margin-top:40px; }
@media (max-width:600px) { .header-badge { display:none; } .search-btn { padding:0 16px; } .claude-key-area { flex-direction:column; align-items:flex-start; } .claude-key-area input { width:100%; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">법</div>
      <div>
        <div class="logo-text">산업안전보건법 검색기</div>
        <div class="logo-sub">법제처 국가법령정보 원문 기반</div>
      </div>
    </div>
    <div class="header-badge">법제처 실시간 원문</div>
  </div>
</header>
<main>
  <div class="claude-key-area">
    <label>🤖 AI 해석 키</label>
    <input type="password" id="claudeKey" placeholder="Claude API 키 입력 시 AI 해석 활성화 (선택사항)" oninput="saveClaudeKey()" />
    <span class="hint">없으면 원문만 검색</span>
  </div>
  <div class="search-card">
    <div class="law-tabs">
      <div class="law-tab active" onclick="selectLaw(this,'산업안전보건법')">산업안전보건법</div>
      <div class="law-tab" onclick="selectLaw(this,'산업안전보건법 시행령')">시행령</div>
      <div class="law-tab" onclick="selectLaw(this,'산업안전보건법 시행규칙')">시행규칙</div>
      <div class="law-tab" onclick="selectLaw(this,'산업안전보건기준에 관한 규칙')">안전보건기준규칙</div>
      <div class="law-tab" onclick="selectLaw(this,'중대재해 처벌 등에 관한 법률')">중처법</div>
      <div class="law-tab" onclick="selectLaw(this,'중대재해 처벌 등에 관한 법률 시행령')">중처법 시행령</div>
    </div>
    <div class="search-row">
      <input type="text" class="search-input" id="query" placeholder="키워드 검색 — 지게차, 작업계획서, 특별안전교육..." />
      <button class="search-btn" onclick="doSearch()">검색</button>
    </div>
    <div class="example-tags">
      <button class="ex-tag" onclick="setQuery('지게차')">지게차</button>
      <button class="ex-tag" onclick="setQuery('작업계획서')">작업계획서</button>
      <button class="ex-tag" onclick="setQuery('특별안전교육')">특별안전교육</button>
      <button class="ex-tag" onclick="setQuery('위험성평가')">위험성평가</button>
      <button class="ex-tag" onclick="setQuery('안전관리자')">안전관리자</button>
      <button class="ex-tag" onclick="setQuery('중대재해')">중대재해</button>
      <button class="ex-tag" onclick="setQuery('컨베이어')">컨베이어</button>
      <button class="ex-tag" onclick="setQuery('보호구')">보호구</button>
      <button class="ex-tag" onclick="setQuery('안전보건교육')">안전보건교육</button>
      <button class="ex-tag" onclick="setQuery('도급')">도급</button>
    </div>
  </div>
  <div id="results">
    <div class="state-msg">
      <div class="icon">🔍</div>
      <p>법령을 선택하고 키워드를 검색하세요.<br>법제처 국가법령정보센터 원문을 실시간으로 가져옵니다.</p>
    </div>
  </div>
</main>
<footer>출처: 법제처 국가법령정보센터 (law.go.kr) | 원문 기준이며 법적 효력은 공식 법령 확인 필요 | AI 해석은 참고용</footer>
<script>
const LAW_API_KEY = '2996e0ff7a81735858fb7cee9b38b23fb8899a56c40c30c0ca15837d88638a12';
let selectedLaw = '산업안전보건법';
let articles = [];
const LAW_LINK_MAP = {
  '산업안전보건법':'산업안전보건법',
  '산업안전보건법 시행령':'산업안전보건법+시행령',
  '산업안전보건법 시행규칙':'산업안전보건법+시행규칙',
  '산업안전보건기준에 관한 규칙':'산업안전보건기준에+관한+규칙',
  '중대재해 처벌 등에 관한 법률':'중대재해+처벌+등에+관한+법률',
  '중대재해 처벌 등에 관한 법률 시행령':'중대재해+처벌+등에+관한+법률+시행령'
};
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('claudeApiKey');
  if (saved) document.getElementById('claudeKey').value = saved;
});
function saveClaudeKey() {
  const ck = document.getElementById('claudeKey').value.trim();
  if (ck) localStorage.setItem('claudeApiKey', ck);
}
function getClaudeKey() { return document.getElementById('claudeKey').value.trim(); }
function selectLaw(el, law) {
  document.querySelectorAll('.law-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  selectedLaw = law;
}
function setQuery(q) { document.getElementById('query').value = q; doSearch(); }
async function doSearch() {
  const q = document.getElementById('query').value.trim();
  const div = document.getElementById('results');
  if (!q) { div.innerHTML = '<div class="state-msg"><div class="icon">✏️</div><p>검색어를 입력해주세요.</p></div>'; return; }
  div.innerHTML = '<div class="loading"><div class="spinner"></div> 법령 원문 검색 중...</div>';
  try {
    const data = await fetchLaw(selectedLaw, q);
    articles = data;
    renderResults(articles, q);
  } catch(e) {
    div.innerHTML = '<div class="state-msg"><div class="icon">⚠️</div><p>브라우저 보안 정책으로 직접 검색이 제한됩니다.<br><strong>GitHub Pages에 업로드하면 정상 작동합니다.</strong><br><br>지금은 아래 링크에서 직접 검색하세요 👇</p><br><a href="https://www.law.go.kr/법령/' + (LAW_LINK_MAP[selectedLaw]||'') + '" target="_blank" style="display:inline-block;padding:10px 20px;background:var(--primary);color:white;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">법제처에서 검색하기 →</a></div>';
  }
}
async function fetchLaw(lawName, query) {
  const url = 'https://apis.data.go.kr/1170000/law/getLawSearchList?serviceKey=' + encodeURIComponent(LAW_API_KEY) + '&LawNm=' + encodeURIComponent(lawName) + '&query=' + encodeURIComponent(query) + '&display=10&type=JSON';
  const r = await fetch(url);
  if (!r.ok) throw new Error('API 응답 오류 (' + r.status + ')');
  const data = await r.json();
  return parseResponse(data, lawName);
}
function parseResponse(data, lawName) {
  try {
    const root = data?.LawSearch || data?.response?.body || data;
    const items = root?.law || root?.items?.item || root?.item || [];
    const arr = Array.isArray(items) ? items : (items ? [items] : []);
    if (arr.length === 0) return [];
    return arr.slice(0,8).map(item => ({
      lawName: item.법령명한글 || item.LawNm || lawName,
      article: item.조문번호 ? '제'+item.조문번호+'조' : '',
      title: item.조문제목 || item.ArticleTitle || '',
      content: item.조문내용 || item.ArticleContent || item.조항내용 || '',
      lsId: item.법령ID || item.LsId || ''
    })).filter(a => a.content);
  } catch(e) { return []; }
}
function renderResults(data, query) {
  const div = document.getElementById('results');
  if (!data || data.length === 0) {
    div.innerHTML = '<div class="state-msg"><div class="icon">📭</div><p><strong>"' + query + '"</strong> 검색 결과가 없습니다.<br>다른 키워드로 검색해보세요.</p></div>';
    return;
  }
  const isMiddle = selectedLaw.includes('중대재해');
  const badgeClass = isMiddle ? 'badge-red' : 'badge-blue';
  const lawShort = selectedLaw.replace('산업안전보건법','산안법').replace('중대재해 처벌 등에 관한 법률','중처법');
  const hasClaude = !!getClaudeKey();
  div.innerHTML = '<div class="result-header"><div class="result-count">검색 결과 <strong>' + data.length + '건</strong></div></div>' +
    data.map((a,i) =>
      '<div class="result-card" id="card-' + i + '">' +
        '<div class="result-top">' +
          '<span class="badge-law ' + badgeClass + '">' + lawShort + '</span>' +
          '<span class="badge-origin">원문</span>' +
          '<span class="article-title">' + a.article + ' ' + a.title + '</span>' +
        '</div>' +
        '<div class="article-content">' + highlight(a.content, query) + '</div>' +
        '<div class="result-footer">' +
          '<div class="source-info">출처: <a href="https://www.law.go.kr" target="_blank">법제처 국가법령정보센터</a></div>' +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
            (hasClaude ? '<button class="ai-btn" onclick="getAI(' + i + ')">🤖 AI 해석</button>' : '') +
            '<a class="law-link" href="https://www.law.go.kr/법령/' + (LAW_LINK_MAP[selectedLaw]||'') + '" target="_blank">법제처 원문 보기 →</a>' +
          '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  window._articles = data;
}
function highlight(text, query) {
  if (!query || !text) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(escaped,'gi'), m => '<mark style="background:#fff3b0;border-radius:3px;padding:0 2px">' + m + '</mark>');
}
async function getAI(idx) {
  const ck = getClaudeKey();
  if (!ck) { alert('AI 해석 키를 입력해주세요.'); return; }
  const a = window._articles[idx];
  const card = document.getElementById('card-' + idx);
  let box = card.querySelector('.ai-box');
  if (!box) { box = document.createElement('div'); box.className = 'ai-box'; card.querySelector('.result-footer').insertAdjacentElement('beforebegin', box); }
  box.innerHTML = '<div class="ai-box-header"><span class="badge-ai">AI 해석</span><span class="badge-caution">참고용 — 법적 판단은 원문 확인 필수</span></div><div class="ai-content"><div class="loading" style="padding:10px 0"><div class="spinner"></div> 해석 중...</div></div>';
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ck,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:1000,
        system:'산업안전보건 분야 전문가로서 법령 조문을 현장 안전관리자가 이해하기 쉽게 해석해주세요.\n1. 원문 내용만 기반으로 해석\n2. 핵심 의무사항과 적용 대상 중심으로 설명\n3. 위반시 처벌이 있으면 명시\n4. 3~5문장으로 간결하게\n5. 마지막에 "※ AI 해석은 참고용입니다. 정확한 법적 판단은 원문 및 전문가 확인이 필요합니다." 추가',
        messages:[{role:'user',content:'법령: ' + a.lawName + '\n' + a.article + ' ' + a.title + '\n\n' + a.content}]
      })
    });
    const data = await resp.json();
    const text = data.content?.[0]?.text || '해석을 가져오지 못했습니다.';
    box.innerHTML = '<div class="ai-box-header"><span class="badge-ai">AI 해석</span><span class="badge-caution">참고용 — 법적 판단은 원문 확인 필수</span></div><div class="ai-content">' + text.replace(/\n/g,'<br>') + '</div>';
  } catch(e) {
    box.innerHTML = '<div class="ai-box-header"><span class="badge-ai">오류</span></div><div class="ai-content">오류: ' + e.message + '</div>';
  }
}
document.getElementById('query').addEventListener('keydown', e => { if (e.key==='Enter') doSearch(); });
</script>
</body>
</html>
