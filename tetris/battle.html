<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록게임 대전</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#0a0a1e;}
        body{font-family:'Jua',sans-serif;color:#fff;}
        .screen{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
        .screen.active{display:flex;}
        /* ── LOBBY ── */
        #lobbyScreen{background:linear-gradient(180deg,#0a0a2e,#1a1a4e);overflow-y:auto;overflow-x:hidden;justify-content:flex-start;padding:8px 10px;}
        #lobbyScreen h1{font-family:'Black Han Sans',sans-serif;font-size:32px;letter-spacing:3px;margin-bottom:2px; background:linear-gradient(135deg,#ff4dae,#44bbff,#ffe500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .lobby-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:6px;letter-spacing:2px;}
        .lobby-layout{display:flex;gap:8px;width:100%;max-width:700px;align-items:flex-start;}
        .lobby-col-left{flex:1;display:flex;flex-direction:column;min-width:0;}
        .lobby-col-right{flex:1;display:flex;flex-direction:column;min-width:0;}
        .glass{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.2);border-radius:14px;padding:10px;width:100%;margin-bottom:8px;}
        .glass .lbl{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:7px;}
        .nick-input{width:100%;padding:8px 10px;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);border-radius:10px; color:#fff;font-size:14px;font-family:'Jua',sans-serif;outline:none;margin-bottom:6px;}
        .nick-input::placeholder{color:rgba(255,255,255,0.35);}
        .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px;}
        .time-btn{padding:8px 4px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:10px; color:#ccc;font-family:'Jua',sans-serif;font-size:11px;cursor:pointer;text-align:center;}
        .time-btn .tn{font-family:'Black Han Sans',sans-serif;font-size:16px;color:#fff;}
        .time-btn.sel{background:rgba(74,184,232,0.2);border-color:#4ab8e8;color:#4ab8e8;}
        .time-btn.sel .tn{color:#4ab8e8;}
        .big-btn{width:100%;padding:11px;font-family:'Black Han Sans',sans-serif;font-size:16px;letter-spacing:1px; color:#fff;border:none;border-radius:12px;cursor:pointer;margin-bottom:8px;}
        .big-btn.blue{background:linear-gradient(135deg,#4ab8e8,#1a6ab1);box-shadow:0 4px 14px rgba(74,184,232,0.35);}
        .big-btn.purple{background:linear-gradient(135deg,#a855f7,#6366f1);box-shadow:0 4px 14px rgba(168,85,247,0.35);}
        .big-btn.gray{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.25);}
        .small-btn{padding:7px 14px;font-family:'Black Han Sans',sans-serif;font-size:12px;letter-spacing:1px; color:rgba(255,255,255,0.65);border:1px solid rgba(255,255,255,0.2);border-radius:10px;cursor:pointer;background:rgba(255,255,255,0.07);margin-bottom:6px;width:100%;text-align:center;}
        .room-input-row{display:flex;gap:6px;margin-bottom:0;}
        .room-input{flex:1;padding:8px 10px;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);border-radius:10px; color:#fff;font-size:14px;font-family:'Jua',sans-serif;outline:none;letter-spacing:3px;text-align:center;text-transform:uppercase;}
        .room-input::placeholder{color:rgba(255,255,255,0.3);letter-spacing:1px;text-transform:none;}
        .join-btn{padding:8px 12px;background:linear-gradient(135deg,#a855f7,#6366f1);border:none;border-radius:10px; color:#fff;font-family:'Black Han Sans',sans-serif;font-size:14px;cursor:pointer;white-space:nowrap;}
        /* WAITING */
        #waitScreen{background:linear-gradient(180deg,#0a0a2e,#1a1a4e);}
        .wait-box{background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.2);border-radius:24px; padding:32px 24px;text-align:center;width:100%;max-width:340px;}
        .wait-box h2{font-family:'Black Han Sans',sans-serif;font-size:26px;margin-bottom:8px;}
        .room-code-display{font-family:'Black Han Sans',sans-serif;font-size:40px;letter-spacing:8px;color:#4ab8e8; background:rgba(74,184,232,0.1);border:2px dashed rgba(74,184,232,0.4);border-radius:14px; padding:16px 20px;margin:16px 0;cursor:pointer;user-select:all;}
        .room-code-display:active{background:rgba(74,184,232,0.2);}
        .copy-hint{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:20px;}
        .players-row{display:flex;gap:12px;margin-bottom:24px;}
        .player-slot{flex:1;padding:14px 8px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.15); border-radius:14px;text-align:center;font-size:13px;}
        .player-slot.me{border-color:#4ab8e8;}
        .player-slot .ps-name{font-family:'Black Han Sans',sans-serif;font-size:15px;margin-top:6px; white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .player-slot .ps-status{font-size:11px;color:rgba(255,255,255,0.45);margin-top:3px;}
        .dot-anim::after{content:'...';animation:dots 1.2s steps(3,end) infinite;}
        @keyframes dots{0%,100%{content:'.';}33%{content:'..';}66%{content:'...';}}
        .wait-time-row{display:flex;gap:8px;margin-bottom:16px;}
        .wait-time-btn{flex:1;padding:10px 4px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.15); border-radius:12px;color:#aaa;font-family:'Jua',sans-serif;font-size:12px;cursor:pointer;text-align:center;}
        .wait-time-btn .wtn{font-family:'Black Han Sans',sans-serif;font-size:18px;color:#ddd;}
        .wait-time-btn.sel{background:rgba(74,184,232,0.15);border-color:#4ab8e8;}
        .wait-time-btn.sel .wtn{color:#4ab8e8;}
        .wait-time-btn:disabled,.wait-time-btn[disabled]{opacity:0.4;cursor:default;}
        /* ── GAME ── */
        #gameScreen{flex-direction:column;padding:0;justify-content:flex-start;background:#0a0a1e;position:relative;}
        #topBar{display:flex;align-items:center;padding:6px 10px;gap:8px;background:rgba(255,255,255,0.07); border-bottom:1px solid rgba(255,255,255,0.12);flex-shrink:0;}
        .timer-display{font-family:'Black Han Sans',sans-serif;font-size:24px;color:#ffe066;min-width:70px;text-align:center;}
        .timer-display.danger{color:#ff4466;animation:pulse .5s ease infinite alternate;}
        @keyframes pulse{from{transform:scale(1);}to{transform:scale(1.1);}}
        .score-box{display:flex;flex-direction:column;align-items:center;min-width:60px;}
        .score-box .sl{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:.5px;}
        .score-box .sv{font-family:'Black Han Sans',sans-serif;font-size:16px;}
        .score-box .sv.mine{color:#4ab8e8;}
        .score-box .sv.theirs{color:#ff8888;}
        .sep{flex:1;}
        #gameArea{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:4px;min-height:0;overflow:hidden;}
        .board-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
        .board-label{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:1px;}
        #gameCanvas{display:block;image-rendering:pixelated;border:2px solid rgba(74,184,232,0.5);border-radius:8px;}
        .mini-wrap{display:flex;flex-direction:column;gap:4px;}
        .mini-label{font-size:9px;color:rgba(255,255,255,0.4);text-align:center;letter-spacing:.5px;}
        #opponentCanvas{display:block;image-rendering:pixelated;border:2px solid rgba(255,100,100,0.4);border-radius:6px;opacity:0.9;}
        #controls{width:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px; padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px)); background:rgba(0,0,0,0.3);border-top:1.5px solid rgba(255,255,255,0.12);}
        .cbtn{flex:1;max-width:130px;height:130px;border-radius:16px;color:#fff;font-size:42px; display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none; -webkit-user-select:none;touch-action:none;transition:all .08s;}
        .cbtn.lr{background:rgba(255,255,255,0.15);border:2.5px solid rgba(255,255,255,0.35);}
        .cbtn.rot{background:rgba(255,200,30,0.25);border:2.5px solid rgba(255,220,60,0.6);}
        .cbtn.dn{background:rgba(30,180,255,0.25);border:2.5px solid rgba(60,200,255,0.5);}
        .cbtn:active,.cbtn.pressed{transform:scale(.88);}
        /* ── OVERLAYS ── */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(10px);}
        .overlay.on{display:flex;}
        .ov-box{background:rgba(20,20,50,0.95);border:2px solid rgba(255,255,255,0.25);border-radius:26px; padding:32px 24px;text-align:center;width:88%;max-width:320px;}
        .ov-box h2{font-family:'Black Han Sans',sans-serif;font-size:28px;margin-bottom:12px;}
        .result-row{display:flex;gap:10px;margin-bottom:20px;}
        .result-card{flex:1;padding:14px 8px;border-radius:14px;text-align:center;}
        .result-card.win{background:rgba(74,184,232,0.2);border:2px solid #4ab8e8;}
        .result-card.lose{background:rgba(255,70,100,0.15);border:2px solid rgba(255,70,100,0.4);}
        .result-card.draw{background:rgba(255,200,0,0.15);border:2px solid rgba(255,200,0,0.4);}
        .result-card .rc-name{font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:4px;}
        .result-card .rc-score{font-family:'Black Han Sans',sans-serif;font-size:24px;}
        .result-card .rc-badge{font-size:20px;margin-top:4px;}
        .ov-btn{width:100%;padding:16px;font-family:'Black Han Sans',sans-serif;font-size:19px;border:none;border-radius:14px;cursor:pointer;letter-spacing:2px;margin-top:8px;}
        .ov-btn.pri{background:linear-gradient(135deg,#4ab8e8,#1a6ab1);color:#fff;}
        .ov-btn.sec{background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);color:#fff;}
        /* ── ATTACK FLASH ── */
        #attackFlash{position:fixed;inset:0;pointer-events:none;z-index:150;opacity:0; box-shadow:inset 0 0 0 6px rgba(255,50,50,0.9),inset 0 0 50px rgba(255,0,0,0.4); transition:opacity .1s;}
        #attackFlash.show{opacity:1;animation:attackFade .6s ease forwards;}
        @keyframes attackFade{0%{opacity:1;}100%{opacity:0;}}
        /* ── TOAST ── */
        .toast{position:fixed;left:50%;transform:translateX(-50%);font-family:'Black Han Sans',sans-serif; border-radius:14px;z-index:300;display:none;pointer-events:none;white-space:nowrap;padding:10px 20px;}
        #gameToast{top:22%;background:rgba(0,0,0,0.75);color:#fff;font-size:16px;}
        #attackToast{top:30%;background:linear-gradient(135deg,#ff4466,#cc0033);color:#fff;font-size:14px;}
        /* ── LOBBY ERROR ── */
        #lobbyMsg{font-size:13px;color:#ff8888;min-height:18px;margin-top:-6px;margin-bottom:4px;text-align:center;}
        /* ── GAME MODE ── */
        .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px;}
        .mode-btn{padding:9px 4px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:10px;color:#ccc;font-family:'Jua',sans-serif;font-size:12px;cursor:pointer;text-align:center;transition:all 0.2s;}
        .mode-btn .mn{font-family:'Black Han Sans',sans-serif;font-size:16px;color:#fff;display:block;margin-bottom:1px;}
        .mode-btn.sel{background:rgba(255,107,107,0.2);border-color:#ff6b6b;color:#ff6b6b;}
        .mode-btn.sel .mn{color:#ff6b6b;}
        .mode-btn.normal.sel{background:rgba(74,184,232,0.2);border-color:#4ab8e8;color:#4ab8e8;}
        .mode-btn.normal.sel .mn{color:#4ab8e8;}
        /* ── ROOM LIST ── */
        .room-list-section{width:100%;margin-bottom:8px;}
        .room-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
        .room-list-refresh{background:none;border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:rgba(255,255,255,0.6);font-size:11px;padding:3px 8px;cursor:pointer;font-family:'Jua',sans-serif;}
        .room-list-body{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;}
        .room-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:7px 10px;cursor:pointer;transition:all 0.15s;}
        .room-item:hover{background:rgba(255,255,255,0.12);border-color:rgba(74,184,232,0.5);}
        .room-item-left{display:flex;flex-direction:column;gap:1px;}
        .room-item-code{font-family:'Black Han Sans',sans-serif;font-size:14px;color:#4ab8e8;letter-spacing:2px;}
        .room-item-info{font-size:10px;color:rgba(255,255,255,0.5);}
        .room-item-mode{font-size:11px;padding:2px 6px;border-radius:7px;font-family:'Jua',sans-serif;}
        .room-item-mode.item{background:rgba(255,107,107,0.2);color:#ff6b6b;border:1px solid rgba(255,107,107,0.4);}
        .room-item-mode.normal{background:rgba(74,184,232,0.2);color:#4ab8e8;border:1px solid rgba(74,184,232,0.4);}
        .room-list-empty{text-align:center;color:rgba(255,255,255,0.3);font-size:12px;padding:12px;}
        /* ── WAIT MODE BADGE ── */
        .wait-mode-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-family:'Jua',sans-serif;margin-bottom:10px;}
        .wait-mode-badge.item{background:rgba(255,107,107,0.2);color:#ff6b6b;border:1px solid rgba(255,107,107,0.4);}
        .wait-mode-badge.normal{background:rgba(74,184,232,0.2);color:#4ab8e8;border:1px solid rgba(74,184,232,0.4);}
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="attackFlash"></div>
    <div class="toast" id="gameToast"></div>
    <div class="toast" id="attackToast"></div>
    <div id="lobbyScreen" class="screen">
        <h1>⚔️ 대전</h1>
        <div class="lobby-sub">BATTLE MODE</div>
        <div class="lobby-layout">
            <div class="lobby-col-left">
                <div class="glass">
                    <div class="lbl">🤝 닉네임</div>
                    <input id="nickInput" class="nick-input" type="text" maxlength="10" placeholder="닉네임 입력">
                </div>
                <div class="glass">
                    <div class="lbl">⏱ 제한 시간 선택</div>
                    <div class="time-grid">
                        <div class="time-btn" data-sec="120"><div class="tn">2분</div>여유</div>
                        <div class="time-btn sel" data-sec="60"><div class="tn">1분</div>표준</div>
                        <div class="time-btn" data-sec="30"><div class="tn">30초</div>스피드</div>
                    </div>
                </div>
                <div class="glass">
                    <div class="lbl">🎮 게임 모드</div>
                    <div class="mode-grid">
                        <div class="mode-btn normal sel" id="modeNormalBtn" onclick="selectMode('normal')"><span class="mn">일반전</span>블록 대결</div>
                        <div class="mode-btn item" id="modeItemBtn" onclick="selectMode('item')"><span class="mn">아이템전</span>아이템 대결</div>
                    </div>
                </div>
                <button class="big-btn blue" id="createBtn">🏠 방 만들기</button>
            </div>
            <div class="lobby-col-right">
                <div class="glass">
                    <div class="lbl">🔑 방 코드로 참가</div>
                    <div class="room-input-row">
                        <input id="roomCodeInput" class="room-input" type="text" maxlength="6" placeholder="코드 입력">
                        <button class="join-btn" id="joinBtn">참가</button>
                    </div>
                </div>
                <div class="room-list-section" id="roomListSection">
                    <div class="room-list-header">
                        <div class="lbl" style="margin:0">🏠 열린 방 목록</div>
                        <button class="room-list-refresh" onclick="refreshRoomList()">🔄 새로고침</button>
                    </div>
                    <div class="room-list-body" id="roomListBody">
                        <div class="room-list-empty">방을 불러오는 중...</div>
                    </div>
                </div>
                <button class="small-btn" onclick="location.href='index.html'">← 일반 게임으로</button>
            </div>
        </div>
    </div>
    <div id="waitScreen" class="screen">
        <div class="wait-box">
            <h2>🏡 대기 중</h2>
            <div id="waitModeBadge" class="wait-mode-badge normal">일반전</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:4px;">방 코드를 공유하세요</div>
            <div class="room-code-display" id="roomCodeDisplay" onclick="copyRoomCode()">------</div>
            <div class="copy-hint">탭하면 복사됩니다</div>
            <div id="waitTimeSel" style="margin-bottom:14px;">
                <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:8px;">⏳ 제한 시간</div>
                <div class="wait-time-row">
                    <div class="wait-time-btn" data-sec="120"><div class="wtn">2분</div>여유</div>
                    <div class="wait-time-btn sel" data-sec="60"><div class="wtn">1분</div>표준</div>
                    <div class="wait-time-btn" data-sec="30"><div class="wtn">30초</div>스피드</div>
                </div>
            </div>
            <div class="players-row">
                <div class="player-slot me">
                    <div>👑 방장</div>
                    <div class="ps-name" id="p1Name">-</div>
                    <div class="ps-status">준비 완료</div>
                </div>
                <div class="player-slot">
                    <div>🎮 상대</div>
                    <div class="ps-name" id="p2Name">-</div>
                    <div class="ps-status dot-anim" id="p2Status">대기 중</div>
                </div>
            </div>
            <button class="big-btn blue" id="startWaitBtn" disabled>상대를 기다리는 중<span class="dot-anim"></span></button>
            <button class="big-btn gray" id="cancelWaitBtn" style="margin-top:8px;">취소</button>
        </div>
    </div>
    <div id="gameScreen" class="screen">
        <div id="topBar">
            <div class="score-box"><div class="sl">내 점수</div><div class="sv mine" id="myScoreDisp">0</div></div>
            <div class="sep"></div>
            <div class="timer-display" id="timerDisp">1:00</div>
            <div class="sep"></div>
            <div class="score-box"><div class="sl">상대 점수</div><div class="sv theirs" id="opScoreDisp">0</div></div>
        </div>
        <div id="gameArea">
            <div class="board-wrap">
                <div class="board-label">나</div>
                <canvas id="gameCanvas"></canvas>
                <div class="mini-wrap">
                    <div class="mini-label">NEXT</div>
                    <canvas id="nextCanvas" width="72" height="28"></canvas>
                </div>
            </div>
            <div class="board-wrap">
                <div class="board-label">상대</div>
                <canvas id="opponentCanvas"></canvas>
            </div>
        </div>
        <div id="controls">
            <div class="cbtn lr" id="btnL">◀</div>
            <div class="cbtn rot" id="btnRot">🔄</div>
            <div class="cbtn dn" id="btnD">▼</div>
            <div class="cbtn lr" id="btnR">▶</div>
        </div>
    </div>
    <div class="overlay" id="resultOv">
        <div class="ov-box">
            <h2 id="resultTitle">🏆 결과</h2>
            <div class="result-row" id="resultRow"></div>
            <button class="ov-btn pri" id="rematchBtn">🔄 재대결</button>
            <button class="ov-btn sec" id="resultHomeBtn">🏡 메인으로</button>
        </div>
    </div>
    <script>
