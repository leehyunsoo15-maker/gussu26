<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS 의뢰서 | 이앤원 안전관리 ERP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js"></script>
<style>
:root{
  --orange:#E8620A;--orange-light:#F7893B;--orange-pale:#FFF3EC;
  --navy:#1A2744;--navy-mid:#2C3E6B;
  --gray-dark:#333;--gray-mid:#666;--gray-light:#f0f0f0;--border:#ddd;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#f5f5f5;color:var(--gray-dark);font-size:14px;}
.page-header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px;}
.page-header h1{font-size:17px;font-weight:700;}
.ai-badge{margin-left:auto;background:var(--orange);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;}
.container{max-width:960px;margin:0 auto;padding:18px 14px;}
.card{background:#fff;border-radius:8px;border:1px solid var(--border);margin-bottom:14px;overflow:hidden;}
.card-header{background:var(--navy);color:#fff;padding:9px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;}
.doc-badge{margin-left:auto;font-size:12px;font-weight:700;background:var(--orange);padding:2px 10px;border-radius:4px;}
.card-body{padding:16px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.full{grid-column:1/-1;}
label{font-size:11px;color:var(--gray-mid);font-weight:600;}
input[type=text],input[type=date],input[type=number],textarea{
  border:1px solid var(--border);border-radius:4px;padding:6px 9px;
  font-family:inherit;font-size:13px;width:100%;
}
input:focus,textarea:focus{outline:none;border-color:var(--orange);}
textarea{resize:vertical;}
.as-item{background:#f8f9ff;border:1px solid #c5cae9;border-radius:6px;padding:12px;margin-bottom:8px;}
.as-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.as-hd-title{font-size:12px;font-weight:700;color:var(--navy);}
.del-btn{background:none;border:none;cursor:pointer;color:#bbb;font-size:17px;line-height:1;}
.del-btn:hover{color:var(--orange);}
.as-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:start;margin-bottom:8px;}
.as-row:last-child{margin-bottom:0;}
.as-lbl{font-size:11px;font-weight:700;color:var(--navy);padding-top:8px;}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.photo-slot{position:relative;border:2px dashed var(--border);border-radius:8px;background:#fafafa;overflow:hidden;cursor:pointer;transition:border-color .2s;}
.photo-slot:hover{border-color:var(--orange);}
.photo-slot.filled{border-style:solid;}
.photo-slot input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2;}
.ph-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;color:var(--gray-mid);}
.ph-placeholder .ico{font-size:32px;margin-bottom:6px;}
.ph-placeholder p{font-size:12px;}
.ph-img{width:100%;height:180px;object-fit:cover;display:block;}
.ph-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:14px;display:none;align-items:center;justify-content:center;z-index:3;}
.photo-slot.filled .ph-del{display:flex;}
.ph-cap{width:100%;border:none;border-top:1px solid var(--border);padding:5px 8px;font-size:11px;font-family:inherit;background:#f8f8f8;text-align:center;}
.ph-cap:focus{outline:none;background:#fff;}
.status-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.st-btn{padding:5px 14px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;}
.st-btn.aw{background:#fff8e1;border-color:#f9a825;color:#e65100;font-weight:700;}
.st-btn.ad{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32;font-weight:700;}
.st-btn.ah{background:#ffebee;border-color:#c62828;color:#c62828;font-weight:700;}
.action-bar{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}
.btn{padding:9px 22px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:700;transition:all .2s;}
.btn-p{background:var(--orange);color:#fff;}.btn-p:hover{background:var(--orange-light);}
.btn-s{background:var(--navy);color:#fff;}.btn-s:hover{background:var(--navy-mid);}
.btn-o{background:#fff;border:1px solid var(--border);color:var(--gray-dark);}.btn-o:hover{border-color:var(--orange);color:var(--orange);}
.btn-add{background:none;border:1px dashed var(--border);border-radius:4px;padding:5px 14px;cursor:pointer;font-size:12px;color:var(--gray-mid);font-family:inherit;margin-top:6px;}
.btn-add:hover{border-color:var(--orange);color:var(--orange);}
@media(max-width:640px){.g3{grid-template-columns:1fr;}.photo-grid{grid-template-columns:1fr;}}
@media print{
  @page{size:A4 portrait;margin:8mm;}
  body{background:#fff;font-size:11px;}
  .ai-badge,.action-bar,.ph-del,.btn-add,.page-header{display:none!important;}
  .container{padding:0;max-width:100%;}
  .card{break-inside:avoid;margin-bottom:5px;}
  .card-header{padding:5px 10px;font-size:11px;}
  .card-body{padding:6px 10px;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  .fg{gap:2px;}
  label{font-size:10px;}
  input[type=text],input[type=date],input[type=number],textarea{font-size:11px;padding:2px 5px;}
  textarea{min-height:unset;}
  .as-item{padding:5px 8px;margin-bottom:4px;}
  .as-hd{margin-bottom:3px;}
  .as-row{gap:4px;margin-bottom:3px;}
  .as-lbl{font-size:10px;padding-top:3px;}
  .photo-grid{grid-template-columns:1fr 1fr;gap:5px;}
  .ph-img{height:110px;}
  .ph-placeholder{height:110px;}
  .ph-cap{font-size:10px;padding:2px 5px;}
  .status-btns{gap:4px;}
  .st-btn{padding:2px 8px;font-size:10px;}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact;}
}
</style>
</head>
<body>

<div class="page-header">
  <div>
    <div style="font-size:11px;opacity:.6;">이앤원(주) 여주물류센터</div>
    <h1>🔧 AS 요청서 의뢰서</h1>
  </div>
  <span class="ai-badge">AI ERP</span>
</div>

<div class="container">

  <div class="card">
    <div class="card-header">📋 기본정보 <span class="doc-badge" id="doc-display">ENO-2026-R-001</span></div>
    <div class="card-body">
      <div class="g3">
        <div class="fg"><label>일 자</label><input type="date" id="req-date"></div>
        <div class="fg"><label>문서 번호</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="doc-prefix" value="ENO-2026-R-" style="flex:1;" oninput="updDoc()">
            <input type="number" id="doc-num" value="1" min="1" style="width:58px;" oninput="updDoc()">
          </div>
        </div>
        <div class="fg"><label>담 당 자</label><input type="text" id="req-person" value="이현수"></div>
        <div class="fg"><label>연 락 처</label><input type="text" id="req-tel" value="010-9934-7494"></div>
        <div class="fg"><label>의뢰 부서</label><input type="text" id="req-from" value="이앤원"></div>
        <div class="fg"><label>처리 부서</label><input type="text" id="req-to" value="기술팀"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">⚠️ AS 요청 내용</div>
    <div class="card-body">
      <div id="as-list"></div>
      <button class="btn-add" onclick="addAs()">+ AS 항목 추가</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">📷 사진 첨부</div>
    <div class="card-body">
      <p style="font-size:11px;color:var(--gray-mid);margin-bottom:10px;">클릭하여 카메라 또는 갤러리에서 사진을 선택하세요.</p>
      <div class="photo-grid" id="photo-grid"></div>
      <button class="btn-add" onclick="addPhoto()" style="margin-top:10px;">+ 사진 칸 추가</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">📊 처리 현황</div>
    <div class="card-body">
      <div class="fg" style="margin-bottom:12px;">
        <label>처리 상태</label>
        <div class="status-btns">
          <button class="st-btn aw" id="st-wait" onclick="setSt('wait')">⏳ 접수/대기</button>
          <button class="st-btn" id="st-done" onclick="setSt('done')">✅ 처리완료</button>
          <button class="st-btn" id="st-hold" onclick="setSt('hold')">❌ 불가/보류</button>
        </div>
      </div>
      <div class="g3">
        <div class="fg"><label>처리 완료일</label><input type="date" id="done-date"></div>
        <div class="fg"><label>처리자</label><input type="text" id="done-person" placeholder="기술팀 담당자"></div>
        <div class="fg full"><label>처리 내용 / 비고</label><textarea id="done-memo" rows="2" placeholder="처리 내용 또는 보류 사유"></textarea></div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-o" onclick="resetAll()">초기화</button>
    <button class="btn btn-s" onclick="window.print()">🖨️ 인쇄</button>
    <button class="btn btn-p" onclick="saveDocx()">💾 AS의뢰서 저장 (docx)</button>
  </div>

</div>

<script>
var asIdx = 0, photoIdx = 0, photos = {}, curSt = 'wait';

function updDoc(){
  var p = document.getElementById('doc-prefix').value;
  var n = String(document.getElementById('doc-num').value).padStart(3,'0');
  document.getElementById('doc-display').textContent = p + n;
}

function addAs(data){
  asIdx++;
  var n = asIdx;
  var d = data || {no:'', content:''};
  var div = document.createElement('div');
  div.className = 'as-item';
  div.id = 'as-' + n;
  div.innerHTML =
    '<div class="as-hd"><span class="as-hd-title">항목 ' + n + '</span>' +
    '<button class="del-btn" onclick="document.getElementById(\'as-' + n + '\').remove()">✕</button></div>' +
    '<div class="as-row"><span class="as-lbl">위치 (NO)</span>' +
    '<input type="text" id="asno-' + n + '" value="' + d.no + '" placeholder="예: 5번 도크 / B2B 기둥 / 소터 1번 근처"></div>' +
    '<div class="as-row"><span class="as-lbl">AS 사항</span>' +
    '<textarea id="asct-' + n + '" rows="3" placeholder="예: 수동도크레벨러 연결 쇄사슬 파손&#10;수리 부탁 드립니다">' + d.content + '</textarea></div>';
  document.getElementById('as-list').appendChild(div);
}

function addPhoto(cap){
  photoIdx++;
  var n = photoIdx;
  photos[n] = null;
  var slot = document.createElement('div');
  slot.className = 'photo-slot';
  slot.id = 'ps-' + n;
  slot.innerHTML =
    '<input type="file" accept="image/*" onchange="loadPh(this,' + n + ')">' +
    '<div class="ph-placeholder" id="ph-' + n + '">' +
      '<div class="ico">📷</div><p>클릭하여 사진 선택</p>' +
      '<p style="font-size:11px;margin-top:2px;color:#aaa;">카메라 또는 갤러리</p></div>' +
    '<button class="ph-del" onclick="delPh(event,' + n + ')">✕</button>' +
    '<input class="ph-cap" id="pc-' + n + '" type="text" placeholder="사진 설명" value="' + (cap||'') + '">';
  document.getElementById('photo-grid').appendChild(slot);
}

function loadPh(input, n){
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    photos[n] = e.target.result;
    var slot = document.getElementById('ps-' + n);
    slot.classList.add('filled');
    var ph = document.getElementById('ph-' + n);
    if(ph) ph.style.display = 'none';
    var img = slot.querySelector('.ph-img');
    if(!img){ img = document.createElement('img'); img.className = 'ph-img'; slot.insertBefore(img, slot.querySelector('.ph-del')); }
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function delPh(e, n){
  e.stopPropagation();
  photos[n] = null;
  var slot = document.getElementById('ps-' + n);
  slot.classList.remove('filled');
  var img = slot.querySelector('.ph-img');
  if(img) img.remove();
  var ph = document.getElementById('ph-' + n);
  if(ph) ph.style.display = '';
  var fi = slot.querySelector('input[type=file]');
  if(fi) fi.value = '';
}

function setSt(s){
  curSt = s;
  document.getElementById('st-wait').className = 'st-btn' + (s==='wait'?' aw':'');
  document.getElementById('st-done').className = 'st-btn' + (s==='done'?' ad':'');
  document.getElementById('st-hold').className = 'st-btn' + (s==='hold'?' ah':'');
}

function resetAll(){
  if(!confirm('초기화하시겠습니까?')) return;
  document.getElementById('as-list').innerHTML = '';
  document.getElementById('photo-grid').innerHTML = '';
  asIdx = 0; photoIdx = 0; photos = {};
  document.getElementById('req-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('done-date').value = '';
  document.getElementById('done-person').value = '';
  document.getElementById('done-memo').value = '';
  setSt('wait');
  init();
}

function init(){
  addAs();
  addPhoto('현장 사진 1'); addPhoto('현장 사진 2');
  addPhoto('현장 사진 3'); addPhoto('현장 사진 4');
}

function saveDocx(){
  var D = docx;
  var docNo = document.getElementById('doc-display').textContent;
  var reqDate = document.getElementById('req-date').value;

  function mc(txt, bold, fill){
    return new D.TableCell({
      children:[new D.Paragraph({children:[new D.TextRun({text:txt||'',bold:!!bold,size:22})],alignment:D.AlignmentType.CENTER})],
      shading:{fill:fill||'FFFFFF'}
    });
  }

  var infoTable = new D.Table({rows:[
    new D.TableRow({children:[mc('일  자',true,'F0F0F0'),mc(reqDate),mc('문서 번호',true,'F0F0F0'),mc(docNo)]}),
    new D.TableRow({children:[mc('담  당  자',true,'F0F0F0'),mc(document.getElementById('req-person').value),mc('연  락  처',true,'F0F0F0'),mc(document.getElementById('req-tel').value)]}),
    new D.TableRow({children:[mc('의뢰 부서',true,'F0F0F0'),mc(document.getElementById('req-from').value),mc('처리 부서',true,'F0F0F0'),mc(document.getElementById('req-to').value)]}),
  ],width:{size:100,type:D.WidthType.PERCENTAGE}});

  var asRows = [new D.TableRow({children:[mc('NO',true,'1A2744'),mc('위치',true,'1A2744'),mc('AS 사항',true,'1A2744')]})];
  var ai = 1;
  document.querySelectorAll('.as-item').forEach(function(item){
    var id = item.id.replace('as-','');
    var no = (document.getElementById('asno-'+id)||{value:''}).value;
    var ct = (document.getElementById('asct-'+id)||{value:''}).value;
    asRows.push(new D.TableRow({children:[
      new D.TableCell({children:[new D.Paragraph({children:[new D.TextRun({text:String(ai++),size:22})],alignment:D.AlignmentType.CENTER})],width:{size:8,type:D.WidthType.PERCENTAGE}}),
      new D.TableCell({children:[new D.Paragraph({children:[new D.TextRun({text:no,size:22})]})],width:{size:28,type:D.WidthType.PERCENTAGE}}),
      new D.TableCell({children:[new D.Paragraph({children:[new D.TextRun({text:ct,size:22})]})],width:{size:64,type:D.WidthType.PERCENTAGE}}),
    ]}));
  });
  var asTable = new D.Table({rows:asRows,width:{size:100,type:D.WidthType.PERCENTAGE}});

  var stTxt = curSt==='wait'?'접수/대기':curSt==='done'?'처리완료':'불가/보류';
  var stTable = new D.Table({rows:[
    new D.TableRow({children:[mc('처리 상태',true,'F0F0F0'),mc(stTxt),mc('처리 완료일',true,'F0F0F0'),mc(document.getElementById('done-date').value)]}),
    new D.TableRow({children:[mc('처리자',true,'F0F0F0'),mc(document.getElementById('done-person').value),mc('처리 내용',true,'F0F0F0'),mc(document.getElementById('done-memo').value)]}),
  ],width:{size:100,type:D.WidthType.PERCENTAGE}});

  var children = [
    new D.Paragraph({children:[new D.TextRun({text:'AS 요청서 의뢰서',bold:true,size:36})],alignment:D.AlignmentType.CENTER}),
    new D.Paragraph({text:''}),
    infoTable,
    new D.Paragraph({text:''}),
    new D.Paragraph({children:[new D.TextRun({text:'AS 요청 내용',bold:true,size:26})]}),
    new D.Paragraph({text:''}),
    asTable,
    new D.Paragraph({text:''}),
  ];

  // 사진 처리
  var validKeys = Object.keys(photos).filter(function(k){ return photos[k]; });
  if(validKeys.length === 0){
    children.push(new D.Paragraph({children:[new D.TextRun({text:'처리 현황',bold:true,size:26})]}));
    children.push(new D.Paragraph({text:''}));
    children.push(stTable);
    var doc2 = new D.Document({sections:[{children:children}]});
    D.Packer.toBlob(doc2).then(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
    var firstNo2 = '';
    var firstItem2 = document.querySelector('.as-item');
    if(firstItem2){
      var id2 = firstItem2.id.replace('as-','');
      var noEl2 = document.getElementById('asno-'+id2);
      if(noEl2) firstNo2 = noEl2.value.replace(/\s+/g,'_').substring(0,20);
    }
    var fname2 = 'AS의뢰서_' + (reqDate||'날짜미입력') + (firstNo2 ? '_'+firstNo2 : '');
    a.download = fname2 + '.docx';
    a.click();
    });
    return;
  }

  children.push(new D.Paragraph({children:[new D.TextRun({text:'사진 첨부',bold:true,size:26})]}));
  children.push(new D.Paragraph({text:''}));

  validKeys.forEach(function(k){
    var n = parseInt(k);
    var cap = (document.getElementById('pc-'+n)||{value:''}).value;
    var base64 = photos[k].split(',')[1];
    try{
      var binary = atob(base64);
      var bytes = new Uint8Array(binary.length);
      for(var j=0;j<binary.length;j++) bytes[j]=binary.charCodeAt(j);
      children.push(new D.Paragraph({children:[new D.ImageRun({data:bytes.buffer,transformation:{width:320,height:210}})]}));
      children.push(new D.Paragraph({children:[new D.TextRun({text:cap,size:18,color:'666666'})],alignment:D.AlignmentType.CENTER}));
      children.push(new D.Paragraph({text:''}));
    }catch(err){ console.warn('이미지 오류',err); }
  });

  children.push(new D.Paragraph({children:[new D.TextRun({text:'처리 현황',bold:true,size:26})]}));
  children.push(new D.Paragraph({text:''}));
  children.push(stTable);

  var doc2 = new D.Document({sections:[{children:children}]});
  D.Packer.toBlob(doc2).then(function(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var firstNo = '';
    var firstItem = document.querySelector('.as-item');
    if(firstItem){
      var id = firstItem.id.replace('as-','');
      var noEl = document.getElementById('asno-'+id);
      if(noEl) firstNo = noEl.value.replace(/\s+/g,'_').substring(0,20);
    }
    var fname = 'AS의뢰서_' + (reqDate||'날짜미입력') + (firstNo ? '_'+firstNo : '');
    a.download = fname + '.docx';
    a.click();
  });
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('req-date').value = new Date().toISOString().split('T')[0];
  updDoc();
  init();
});
</script>
</body>
</html>
