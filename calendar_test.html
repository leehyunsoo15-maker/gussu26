<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>미니 캘린더 테스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic',sans-serif;background:#f0f4f9;padding:20px;display:flex;gap:20px;}
.cal{background:white;border-radius:16px;padding:16px;width:320px;box-shadow:0 2px 12px rgba(0,0,0,0.08);}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav{background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;padding:4px 8px;border-radius:6px;line-height:1;}
.cal-nav:hover{background:#f1f5f9;}
.cal-title{font-size:14px;font-weight:700;color:#1a2744;}

.cal-days{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-day-label{text-align:center;font-size:10px;font-weight:600;color:#94a3b8;padding:4px 0;}
.cal-day-label.sun{color:#ef4444;}
.cal-day-label.sat{color:#3b82f6;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:5px;border-radius:8px;
  cursor:pointer;transition:background .1s;position:relative;
}
.cal-cell:hover:not(.today){background:#f8fafc;}
.cal-cell.today{background:#ff6b35;}
.cal-cell.today .cal-num{color:white;font-weight:700;}
.cal-cell.selected:not(.today){background:#fff3ee;outline:1.5px solid #ff6b35;}
.cal-cell.sun .cal-num{color:#ef4444;}
.cal-cell.sat .cal-num{color:#3b82f6;}
.cal-cell.holiday .cal-num{color:#ef4444;}
.cal-cell.other .cal-num{color:#cbd5e1;}
.cal-cell.today .cal-num,.cal-cell.today.sun .cal-num,.cal-cell.today.sat .cal-num,.cal-cell.today.holiday .cal-num{color:white;}
.cal-num{font-size:12px;font-weight:500;line-height:1;}
.cal-hname{font-size:7px;color:#ef4444;text-align:center;line-height:1.1;margin-top:1px;max-width:38px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.cal-cell.today .cal-hname{color:rgba(255,255,255,0.85);}
.cal-dots{display:flex;gap:2px;margin-top:2px;justify-content:center;}
.cal-dot{width:4px;height:4px;border-radius:50%;}

/* 이벤트 */
.ev-section{margin-top:12px;border-top:1px solid #f1f5f9;padding-top:10px;}
.ev-title{font-size:11px;font-weight:700;color:#64748b;margin-bottom:6px;}
.ev-item{padding:6px 8px;border-radius:8px;font-size:11px;margin-bottom:4px;display:flex;align-items:flex-start;gap:6px;}
.ev-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.ev-name{flex:1;color:#1e293b;font-weight:600;line-height:1.3;}
.ev-time{font-size:10px;color:#94a3b8;white-space:nowrap;}
.ev-empty{font-size:11px;color:#94a3b8;text-align:center;padding:10px;}

.legend{display:flex;gap:12px;margin-top:10px;justify-content:center;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8;}
.leg-dot{width:6px;height:6px;border-radius:50%;}

.gcal-link{display:block;text-align:center;margin-top:8px;font-size:11px;color:#ff6b35;text-decoration:none;font-weight:600;}
.gcal-link:hover{text-decoration:underline;}

.loading{text-align:center;padding:30px;color:#94a3b8;font-size:12px;}
.status{font-size:10px;color:#94a3b8;text-align:center;margin-top:6px;}
</style>
</head>
<body>

<div class="cal">
  <div id="calRoot"><div class="loading">📅 캘린더 불러오는 중...</div></div>
</div>

<script>
const API_KEY = 'AIzaSyAOjN5kbbxsOsiFZp4TJHempgNB7O437KU';
const CAL_ID = 'leehyunsoo15@gmail.com';
const HOLIDAY_ID = 'ko.south_korea#holiday@group.v.calendar.google.com';

let curYear = new Date().getFullYear();
let curMonth = new Date().getMonth();
let myEvents = [];
let holidays = {};
let selectedDate = null;
let statusMsg = '';

// 한국 공휴일 하드코딩 (백업용)
const HARD_HOLIDAYS = {
  // 2025년
  '2025-0-1':'신정',
  '2025-0-28':'설날 연휴','2025-0-29':'설날','2025-0-30':'설날 연휴',
  '2025-2-1':'삼일절',
  '2025-4-5':'어린이날',
  '2025-4-6':'대체공휴일',
  '2025-4-5':'석가탄신일',
  '2025-5-6':'현충일',
  '2025-7-15':'광복절',
  '2025-9-5':'추석 연휴','2025-9-6':'추석','2025-9-7':'추석 연휴',
  '2025-9-3':'개천절',
  '2025-9-9':'한글날',
  '2025-11-25':'크리스마스',
  // 2026년
  '2026-0-1':'신정',
  '2026-0-28':'설날 연휴','2026-0-29':'설날','2026-0-30':'설날 연휴',
  '2026-2-1':'삼일절',
  '2026-4-5':'어린이날',
  '2026-4-25':'석가탄신일',
  '2026-5-6':'현충일',
  '2026-7-15':'광복절',
  '2026-9-3':'추석 연휴','2026-9-4':'추석','2026-9-5':'추석 연휴',
  '2026-9-3':'개천절',
  '2026-9-9':'한글날',
  '2026-11-25':'크리스마스',
  // 2027년
  '2027-0-1':'신정',
  '2027-1-16':'설날 연휴','2027-1-17':'설날','2027-1-18':'설날 연휴',
  '2027-2-1':'삼일절',
  '2027-4-5':'어린이날',
  '2027-4-24':'석가탄신일',
  '2027-5-6':'현충일',
  '2027-7-15':'광복절',
  '2027-9-24':'추석 연휴','2027-9-25':'추석','2027-9-26':'추석 연휴',
  '2027-9-3':'개천절',
  '2027-9-9':'한글날',
  '2027-11-25':'크리스마스',
};

// Google Calendar API로 이벤트 가져오기
async function fetchEvents(calId, timeMin, timeMax) {
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime&maxResults=50`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return data.items || [];
}

function parseDate(dateStr) {
  if (!dateStr) return null;
  if (dateStr.includes('T')) return new Date(dateStr);
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatTime(item) {
  if (item.start?.date) return '종일';
  if (item.start?.dateTime) {
    const d = new Date(item.start.dateTime);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return '';
}

async function loadData() {
  const firstDay = new Date(curYear, curMonth, 1);
  const lastDay = new Date(curYear, curMonth + 1, 0);
  const timeMin = firstDay.toISOString();
  const timeMax = new Date(curYear, curMonth + 1, 1).toISOString();

  try {
    // 내 일정
    const items = await fetchEvents(CAL_ID, timeMin, timeMax);
    myEvents = items.map(item => ({
      date: parseDate(item.start?.date || item.start?.dateTime?.split('T')[0]),
      summary: item.summary || '(제목 없음)',
      time: formatTime(item),
      allDay: !!item.start?.date
    })).filter(e => e.date);
    statusMsg = `✅ 내 일정 ${myEvents.length}개 로드됨`;
  } catch(e) {
    myEvents = [];
    statusMsg = `⚠️ 내 일정 로드 실패: ${e.message}`;
  }

  try {
    // 공휴일
    const hItems = await fetchEvents(HOLIDAY_ID, timeMin, timeMax);
    if (hItems.length > 0) {
      holidays = {};
      hItems.forEach(item => {
        const d = parseDate(item.start?.date);
        if (d) {
          const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
          holidays[key] = item.summary;
        }
      });
      statusMsg += ` / 공휴일 ${hItems.length}개 ✅`;
    } else {
      throw new Error('공휴일 데이터 없음');
    }
  } catch(e) {
    // API 실패 시 하드코딩 공휴일 사용
    holidays = {...HARD_HOLIDAYS};
    statusMsg += ' / 공휴일 (기본값) ✅';
  }

  render();
}

function render() {
  const today = new Date();
  const firstDay = new Date(curYear, curMonth, 1);
  const lastDay = new Date(curYear, curMonth + 1, 0);
  const startDow = firstDay.getDay();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  // 이벤트 날짜별 맵
  const evMap = {};
  myEvents.forEach(e => {
    const k = e.date.getDate();
    if (!evMap[k]) evMap[k] = [];
    evMap[k].push(e);
  });

  // 날짜 셀
  let cells = '';
  const prevLast = new Date(curYear, curMonth, 0).getDate();
  for (let i = startDow-1; i >= 0; i--) {
    cells += `<div class="cal-cell other"><span class="cal-num">${prevLast-i}</span></div>`;
  }
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dow = new Date(curYear, curMonth, d).getDay();
    const isToday = d===today.getDate() && curMonth===today.getMonth() && curYear===today.getFullYear();
    const isSel = selectedDate && selectedDate.getDate()===d && selectedDate.getMonth()===curMonth && selectedDate.getFullYear()===curYear;
    const hKey = `${curYear}-${curMonth}-${d}`;
    const hName = holidays[hKey];
    let cls = 'cal-cell';
    if (dow===0||hName) cls += ' sun holiday';
    else if (dow===6) cls += ' sat';
    if (isToday) cls += ' today';
    if (isSel && !isToday) cls += ' selected';
    const dots = (evMap[d]||[]).slice(0,3).map(()=>`<div class="cal-dot" style="background:#ff6b35"></div>`).join('');
    const hTag = hName ? `<div class="cal-hname">${hName.replace('대한민국 ','')}</div>` : '';
    cells += `<div class="${cls}" onclick="sel(${curYear},${curMonth},${d})">
      <span class="cal-num">${d}</span>${hTag}
      ${dots?`<div class="cal-dots">${dots}</div>`:''}
    </div>`;
  }
  const rem = 42 - startDow - lastDay.getDate();
  for (let d = 1; d <= Math.min(rem,7); d++) {
    cells += `<div class="cal-cell other"><span class="cal-num">${d}</span></div>`;
  }

  // 선택된 날 이벤트
  let evHtml = '';
  if (selectedDate) {
    const sEvs = myEvents.filter(e =>
      e.date.getFullYear()===selectedDate.getFullYear() &&
      e.date.getMonth()===selectedDate.getMonth() &&
      e.date.getDate()===selectedDate.getDate()
    );
    const hKey2 = `${selectedDate.getFullYear()}-${selectedDate.getMonth()}-${selectedDate.getDate()}`;
    const hol = holidays[hKey2];
    const label = `${selectedDate.getMonth()+1}월 ${selectedDate.getDate()}일`;
    let items = '';
    if (hol) items += `<div class="ev-item" style="background:#fee2e2"><div class="ev-dot" style="background:#ef4444"></div><span class="ev-name">${hol}</span><span class="ev-time">공휴일</span></div>`;
    sEvs.forEach(e => {
      items += `<div class="ev-item" style="background:#fff3ee"><div class="ev-dot" style="background:#ff6b35"></div><span class="ev-name">${e.summary}</span><span class="ev-time">${e.time}</span></div>`;
    });
    evHtml = `<div class="ev-section"><div class="ev-title">${label} 일정</div>${items||'<div class="ev-empty">일정 없음</div>'}</div>`;
  }

  document.getElementById('calRoot').innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" onclick="move(-1)">‹</button>
      <span class="cal-title">${curYear}년 ${months[curMonth]}</span>
      <button class="cal-nav" onclick="move(1)">›</button>
    </div>
    <div class="cal-days">
      ${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="cal-day-label ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells}</div>
    ${evHtml}
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#ff6b35"></div>내 일정</div>
      <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>공휴일</div>
    </div>
    <a class="gcal-link" href="https://calendar.google.com" target="_blank">구글 캘린더에서 자세히 보기 →</a>
    <div class="status">${statusMsg}</div>
  `;
}

function move(dir) {
  curMonth += dir;
  if (curMonth>11){curMonth=0;curYear++;}
  if (curMonth<0){curMonth=11;curYear--;}
  selectedDate = null;
  statusMsg = '불러오는 중...';
  document.getElementById('calRoot').innerHTML = '<div class="loading">📅 불러오는 중...</div>';
  loadData();
}

function sel(y,m,d) {
  selectedDate = new Date(y,m,d);
  render();
}

loadData();
</script>
</body>
</html>
