<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보호구 관리대장</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--orange:#ff6b35;--navy:#1a2744;--bg:#f8f9fa;--white:#ffffff;--border:#e2e8f0;--text:#2d3748;--muted:#718096;--red:#e53e3e;--green:#38a169;--amber:#d69e2e;--blue:#3182ce;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
.topbar{background:var(--navy);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-title{color:white;font-size:15px;font-weight:700;}
.topbar-btns{display:flex;gap:6px;align-items:center;}
.tbtn{font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);color:white;background:rgba(255,255,255,0.1);cursor:pointer;}
.tbtn.orange{background:var(--orange);border-color:var(--orange);}
.tbtn:hover{opacity:0.85;}
.wrap{max-width:1200px;margin:0 auto;padding:14px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.kpi-num{font-size:24px;font-weight:800;color:var(--navy);}
.kpi-num.orange{color:var(--orange);}
.kpi-num.red{color:var(--red);}
.kpi-num.green{color:var(--green);}
.kpi-label{font-size:11px;color:var(--muted);margin-top:2px;}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.tab{font-size:12px;padding:6px 16px;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--white);color:var(--muted);}
.tab.active{background:var(--orange);color:white;border-color:var(--orange);font-weight:700;}
.section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.section-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.search-bar input,.search-bar select{font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:white;font-family:inherit;}
.search-bar input{flex:1;min-width:150px;}
.btn{font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-family:inherit;background:white;}
.btn.orange{background:var(--orange);color:white;border-color:var(--orange);}
.btn.navy{background:var(--navy);color:white;border-color:var(--navy);}
.btn.green{background:var(--green);color:white;border-color:var(--green);}
.btn.red{background:var(--red);color:white;border-color:var(--red);}
.btn:hover{opacity:0.85;}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{background:#f7f8fa;padding:7px 8px;text-align:left;font-weight:700;color:var(--navy);border-bottom:2px solid var(--border);white-space:nowrap;}
td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:#fafbfc;}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;}
.b-dry{background:#ebf8ff;color:#2b6cb0;}
.b-wet{background:#e6fffa;color:#234e52;}
.b-dc{background:#f0e6ff;color:#553c9a;}
.b-rdc{background:#fff5e6;color:#7b341e;}
.b-dcw{background:#e6f4ff;color:#1a365d;}
.b-sup{background:#f0fff4;color:#22543d;}
.b-warn{background:#fffbeb;color:#744210;}
.b-danger{background:#fff5f5;color:#742a2a;}
.b-retired{background:#f7f7f7;color:#999;}
.name-link{color:var(--orange);cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:2px;}
.ie-cell{cursor:pointer;}
.ie-cell:hover{background:#fff3ee!important;}
.page-info{font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;justify-content:space-between;}
.page-btns{display:flex;gap:4px;}
.page-btn{padding:3px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;background:white;}
.page-btn.active{background:var(--orange);color:white;border-color:var(--orange);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:white;border-radius:14px;padding:20px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.modal-title{font-size:15px;font-weight:700;color:var(--navy);}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-row{display:flex;flex-direction:column;gap:4px;}
.form-label{font-size:11px;font-weight:700;color:var(--muted);}
.form-input{font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;}
.form-input:focus{outline:none;border-color:var(--orange);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);}
.history-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.history-chip{font-size:11px;padding:3px 10px;background:#fff3ee;color:var(--orange);border-radius:20px;border:1px solid var(--orange);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.forms-box{background:#e6f1fb;border:1px solid #b5d4f4;border-radius:8px;padding:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.forms-text{font-size:12px;color:#1a365d;font-weight:700;}
.issue-card{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.dept-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.size-table{border-collapse:collapse;width:100%;font-size:12px;}
.size-table th{background:var(--navy);color:white;padding:6px 10px;text-align:center;border:1px solid #ddd;}
.size-table td{padding:6px 10px;text-align:center;border:1px solid #ddd;font-weight:700;}
.size-table .copy-row td{background:#fffbeb;cursor:pointer;}
.copy-hint{font-size:11px;color:var(--muted);margin-top:6px;}
.new-badge{display:inline-block;font-size:9px;padding:1px 5px;background:#e53e3e;color:white;border-radius:3px;margin-left:4px;vertical-align:middle;}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;z-index:9999;transition:opacity .3s;opacity:0;pointer-events:none;}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">🛡️ 보호구 관리대장 — 안전화</span>
  <div class="topbar-btns">
    <button class="tbtn" onclick="saveData()">💾 저장+백업</button>
    <button class="tbtn" onclick="exportCSV()">📋 CSV</button>
    <button class="tbtn" onclick="document.getElementById('importInput').click()">📂 불러오기</button>
    <input type="file" id="importInput" accept=".json" onchange="importJSON(this)" style="display:none">
    <a class="tbtn" href="index.html">← 메인</a>
  </div>
</div>

<div class="wrap">
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('대시보드')">🏠 홈</div>
    <div class="tab" onclick="switchTab('신청접수')">📥 신청접수 <span id="newBadge" class="new-badge" style="display:none">0</span></div>
    <div class="tab" onclick="switchTab('지급확인서')">🖨️ 지급확인서</div>
    <div class="tab" onclick="switchTab('교체주의')">⚠️ 교체주의</div>
    <div class="tab" onclick="switchTab('명부')">📋 명부 전체</div>
  </div>

  <div id="tabContent"></div>
</div>

<!-- 상세/수정 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">근로자 상세</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-row"><label class="form-label">성명</label><input class="form-input" id="f_name"></div>
      <div class="form-row"><label class="form-label">파트</label>
        <select class="form-input" id="f_part">
          <option>DRY</option><option>WET</option><option>DC</option><option>RDC</option><option>DC-W</option><option>지원</option><option>기타</option>
        </select>
      </div>
      <div class="form-row"><label class="form-label">직무</label><input class="form-input" id="f_job"></div>
      <div class="form-row"><label class="form-label">사이즈</label>
        <select class="form-input" id="f_size">
          <option value="">-</option>
          <option>230</option><option>235</option><option>240</option><option>245</option><option>250</option>
          <option>255</option><option>260</option><option>265</option><option>270</option><option>275</option>
          <option>280</option><option>285</option><option>290</option><option>295</option><option>300</option>
        </select>
      </div>
      <div class="form-row"><label class="form-label">입사일 (선택)</label><input class="form-input" id="f_joinDate" type="date"></div>
      <div class="form-row"><label class="form-label">비고</label><input class="form-input" id="f_note"></div>
    </div>
    <div style="margin-top:12px;">
      <div class="form-label" style="margin-bottom:6px;">지급 이력 (전체)</div>
      <div class="history-list" id="historyList"></div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <input class="form-input" id="newDate" type="date" style="flex:1;" placeholder="새 지급일">
        <button class="btn orange" onclick="addHistory()">+ 지급 추가</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn red" onclick="toggleRetired()">퇴사처리</button>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn orange" onclick="saveModal()">저장</button>
    </div>
  </div>
</div>

<!-- 신규인원 추가 모달 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">➕ 근로자 추가</span>
      <button class="modal-close" onclick="document.getElementById('addModal').classList.remove('show')">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-row"><label class="form-label">성명 *</label><input class="form-input" id="a_name"></div>
      <div class="form-row"><label class="form-label">파트 *</label>
        <select class="form-input" id="a_part">
          <option>DRY</option><option>WET</option><option>DC</option><option>RDC</option><option>DC-W</option><option>지원</option><option>기타</option>
        </select>
      </div>
      <div class="form-row"><label class="form-label">직무</label><input class="form-input" id="a_job"></div>
      <div class="form-row"><label class="form-label">사이즈</label>
        <select class="form-input" id="a_size">
          <option value="">-</option>
          <option>230</option><option>235</option><option>240</option><option>245</option><option>250</option>
          <option>255</option><option>260</option><option>265</option><option>270</option><option>275</option>
          <option>280</option><option>285</option><option>290</option><option>295</option><option>300</option>
        </select>
      </div>
      <div class="form-row"><label class="form-label">입사일 (선택)</label><input class="form-input" id="a_joinDate" type="date"></div>
      <div class="form-row"><label class="form-label">첫 지급일 (선택)</label><input class="form-input" id="a_firstDate" type="date"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="document.getElementById('addModal').classList.remove('show')">취소</button>
      <button class="btn orange" onclick="confirmAdd()">추가</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== DB =====
const DB_NAME='enone_prot_v1', STORE='people';
let db, allData=[], filteredData=[], currentPage=1, currentTab='대시보드', editingNo=null;
const PAGE=50;
const SIZES=[230,235,240,245,250,255,260,265,270,275,280,285,290];

function initDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'no',autoIncrement:true});
    };
    req.onsuccess=e=>{db=e.target.result;res();};
    req.onerror=()=>rej();
  });
}
function dbPut(r){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(r);tx.oncomplete=res;tx.onerror=rej;});}
function dbGetAll(){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).getAll();req.onsuccess=()=>res(req.result);req.onerror=rej;});}

// ===== 날짜 변환 =====
function excelDate(n){
  if(!n||isNaN(n))return '';
  const d=new Date((n-25569)*86400*1000);
  return d.toISOString().slice(0,10);
}
function daysBetween(d1,d2){
  const a=new Date(d1),b=new Date(d2);
  return Math.floor((b-a)/(1000*60*60*24));
}
function lastDate(r){
  const dates=(r.history||[]).filter(d=>d).sort();
  return dates.length?dates[dates.length-1]:'';
}

// ===== KPI =====
function renderKPI(){
  const active=allData.filter(r=>!r.retired);
  const today=new Date().toISOString().slice(0,10);
  const warn=active.filter(r=>{
    const ld=lastDate(r);
    if(!ld)return false;
    const days=daysBetween(ld,today);
    return days<240&&days>=0&&(r.history||[]).length>=2;
  });
  const pending=(window._pending||[]).length;
  const thisMonth=new Date().toISOString().slice(0,7);
  const dueThis=active.filter(r=>{
    const hist=(r.history||[]).slice().sort();
    if(!hist.length)return false;
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+(r.part==='WET'?304:365));
    return next.toISOString().slice(0,7)===thisMonth;
  });
  const todayN=new Date();
  const urgentN=active.filter(r=>{
    const hist=(r.history||[]).slice().sort();
    if(!hist.length)return false;
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+(r.part==='WET'?304:365));
    return Math.ceil((next-todayN)/(1000*60*60*24))<=90;
  });
  document.getElementById('kpiGrid').innerHTML=`
    <div class="kpi"><div class="kpi-num">${active.length}</div><div class="kpi-label">재직 인원</div></div>
    <div class="kpi"><div class="kpi-num orange">${dueThis.length}</div><div class="kpi-label">이번달 지급예정</div></div>
    <div class="kpi"><div class="kpi-num red">${urgentN.length}</div><div class="kpi-label">교체임박·초과</div></div>
    <div class="kpi"><div class="kpi-num green">${allData.filter(r=>r.retired).length}</div><div class="kpi-label">퇴사 처리</div></div>
  `;
}

// ===== 탭 전환 =====
function switchTab(tab){
  currentTab=tab;
  currentPage=1;
  document.querySelectorAll('.tab').forEach(t=>{
    const map={'대시보드':'홈','신청접수':'신청접수','지급확인서':'지급확인서','교체주의':'교체주의','명부':'명부 전체'};
    t.classList.toggle('active', t.textContent.trim().includes(map[tab]||tab));
  });
  renderTab();
}

function renderTab(){
  if(currentTab==='대시보드') renderDashboard();
  else if(currentTab==='명부') renderMembership();
  else if(currentTab==='신청접수') renderApplication();
  else if(currentTab==='지급확인서') renderConfirm();
  else if(currentTab==='교체주의') renderWarning();
}

// ===== 명부 탭 =====
function renderMembership(){
  const showRetired=window._showRetired||false;
  document.getElementById('tabContent').innerHTML=`
    <div class="section">
      <div class="section-title">📋 전체 명부
        <button class="btn orange" onclick="openAddModal()" style="margin-left:auto;">+ 근로자 추가</button>
        <button class="btn" onclick="toggleRetiredView()" style="margin-left:6px;">${showRetired?'재직자만':'퇴사자 포함'}</button>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="이름, 직무 검색..." oninput="applyFilter()">
        <select id="partFilter" onchange="applyFilter()">
          <option value="">전체 파트</option>
          <option>DRY</option><option>WET</option><option>DC</option><option>RDC</option><option>DC-W</option><option>지원</option>
        </select>
        <select id="jobFilter" onchange="applyFilter()">
          <option value="">전체 직무</option>
          <option>1조</option><option>2조</option><option>3조</option><option>4조</option><option>5조</option><option>6조</option>
          <option>DAS</option><option>입하팀</option><option>출하팀(22)</option><option>소터</option><option>리콘다</option>
          <option>패션</option><option>수출</option><option>운영팀(10)</option><option>백암DC</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table id="memberTable">
          <thead><tr>
            <th>No</th><th>성명</th><th>파트</th><th>직무</th><th>사이즈</th>
            <th>최근지급일</th><th>지급횟수</th><th>경과일</th><th>비고</th>
          </tr></thead>
          <tbody id="memberBody"></tbody>
        </table>
      </div>
      <div class="page-info">
        <span id="pageInfo"></span>
        <div class="page-btns" id="pageBtns"></div>
      </div>
    </div>
  `;
  applyFilter();
}

function applyFilter(){
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
  const part=document.getElementById('partFilter')?.value||'';
  const job=document.getElementById('jobFilter')?.value||'';
  const showRetired=window._showRetired||false;
  filteredData=allData.filter(r=>{
    if(!showRetired&&r.retired)return false;
    if(part&&r.part!==part)return false;
    if(job&&r.job!==job)return false;
    if(q&&!r.name?.toLowerCase().includes(q)&&!r.job?.toLowerCase().includes(q))return false;
    return true;
  });
  currentPage=1;
  renderMemberTable();
}

function renderMemberTable(){
  const today=new Date().toISOString().slice(0,10);
  const start=(currentPage-1)*PAGE;
  const pageData=filteredData.slice(start,start+PAGE);
  const tbody=document.getElementById('memberBody');
  if(!tbody)return;
  tbody.innerHTML=pageData.map((r,i)=>{
    const ld=lastDate(r);
    const days=ld?daysBetween(ld,today):null;
    const cnt=(r.history||[]).filter(d=>d).length;
    let daysBadge=days!==null?`${days}일`:'—';
    let daysColor=days!==null&&days<240?'color:var(--red);font-weight:700;':'';
    const partClass={'DRY':'b-dry','WET':'b-wet','DC':'b-dc','RDC':'b-rdc','DC-W':'b-dcw','지원':'b-sup'}[r.part]||'';
    const retiredStyle=r.retired?'opacity:0.4;text-decoration:line-through;':'';
    return `<tr style="${retiredStyle}">
      <td style="color:var(--muted);">${start+i+1}</td>
      <td><span class="name-link" onclick="openDetail(${r.no})">${r.name||''}</span>${r.retired?'<span class="badge b-retired" style="margin-left:4px;">퇴사</span>':''}</td>
      <td><span class="badge ${partClass}">${r.part||''}</span></td>
      <td class="ie-cell" onclick="inlineEdit(${r.no},'job',event)">${r.job||'—'}</td>
      <td class="ie-cell" onclick="inlineEdit(${r.no},'size',event)">${r.size||'—'}</td>
      <td>${ld||'—'}</td>
      <td style="text-align:center;font-weight:700;">${cnt||'—'}</td>
      <td style="${daysColor}">${daysBadge}</td>
      <td style="font-size:10px;color:var(--muted);">${r.note||''}</td>
    </tr>`;
  }).join('');

  const total=filteredData.length;
  const totalPage=Math.ceil(total/PAGE);
  document.getElementById('pageInfo').textContent=`총 ${total}명 (${start+1}~${Math.min(start+PAGE,total)})`;
  let btns='';
  for(let p=1;p<=totalPage;p++){
    if(p===1||p===totalPage||Math.abs(p-currentPage)<=2)
      btns+=`<button class="page-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`;
    else if(Math.abs(p-currentPage)===3)btns+=`<span style="padding:0 4px;">…</span>`;
  }
  document.getElementById('pageBtns').innerHTML=btns;
}

async function inlineEdit(no,field,e){
  const td=e.currentTarget;
  if(td.querySelector('input,select'))return;
  const r=allData.find(d=>d.no===no);
  if(!r)return;
  let el;
  if(field==='size'){
    el=document.createElement('select');
    el.style.cssText='font-size:11px;padding:2px;border:1.5px solid var(--orange);border-radius:4px;font-family:inherit;';
    ['',...SIZES,295,300].forEach(s=>{
      const o=document.createElement('option');
      o.value=s;o.textContent=s||'-';
      if(String(s)===String(r[field]))o.selected=true;
      el.appendChild(o);
    });
  } else {
    el=document.createElement('input');
    el.value=r[field]||'';
    el.style.cssText='font-size:11px;padding:2px;border:1.5px solid var(--orange);border-radius:4px;font-family:inherit;width:100%;min-width:80px;';
  }
  const orig=td.innerHTML;
  td.innerHTML='';td.appendChild(el);el.focus();
  async function commit(){
    const v=el.value;
    if(r[field]!==v){r[field]=v;await dbPut(r);showToast('✅ '+field+' 수정됨');}
    renderMemberTable();
  }
  el.addEventListener('change',commit);
  el.addEventListener('keydown',e2=>{if(e2.key==='Enter')el.blur();if(e2.key==='Escape')td.innerHTML=orig;});
  el.addEventListener('blur',commit);
}

let _xlParsed = [];

function parseExcel(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', range:2}); // 3행(index 2)이 실제 헤더
    const today = new Date().toISOString().slice(0,10);
    _xlParsed = [];
    rows.forEach(row => {
      // 컬럼명 유연하게 파싱 (파트/직무/이름/사이즈)
      const part = String(row['파트']||row['PART']||'').trim();
      const job  = String(row['직무']||row['JOB']||'').trim();
      const name = String(row['이름']||row['NAME']||row['성명']||'').trim();
      const size = String(row['사이즈(mm)']||row['사이즈']||row['SIZE']||'').trim().replace('mm','');
      const note = String(row['비고']||'').trim();
      if(!name) return;
      const existing = allData.find(r=>r.name===name&&!r.retired);
      const lastHist = existing ? (existing.history||[]).slice().sort().pop()||'-' : '-';
      const status = !existing ? '🆕 신규' : existing.size&&existing.size!==size&&size ? '⚠️ SIZE변경' : '✓ 정상';
      _xlParsed.push({name, part, job, size, note, date:today, isNew:!existing, lastHist, status, existing});
    });
    if(!_xlParsed.length){ showToast('❌ 데이터가 없습니다. 양식을 확인하세요.'); return; }
    // 미리보기 렌더
    document.getElementById('xlPreviewBody').innerHTML = _xlParsed.map((r,i)=>`
      <tr>
        <td style="font-weight:700">${r.name}</td>
        <td><span class="badge ${r.part==='WET'?'b-wet':r.part==='DRY'?'b-dry':r.part==='DC'?'b-dc':'b-sup'}">${r.part}</span></td>
        <td>${r.job}</td>
        <td style="text-align:center">${r.size?r.size+'mm':'-'}</td>
        <td style="color:var(--muted)">${r.note}</td>
        <td style="color:var(--muted);text-align:center">${r.lastHist}</td>
        <td style="font-weight:700;color:${r.status.includes('🆕')?'var(--blue)':r.status.includes('⚠️')?'var(--amber)':'var(--green)'}">${r.status}</td>
      </tr>`).join('');
    document.getElementById('xlPreview').style.display='block';
    updateSizeTable();
    showToast(`📊 ${_xlParsed.length}명 파싱 완료 — 확인 후 반영하세요`);
  };
  reader.readAsBinaryString(file);
}

function cancelXl(){
  _xlParsed=[];
  document.getElementById('xlPreview').style.display='none';
  document.getElementById('xlUpload').value='';
  updateSizeTable();
}

async function confirmXl(){
  if(!_xlParsed.length) return;
  const today = new Date().toISOString().slice(0,10);

  // 1. 명부에 반영
  for(const p of _xlParsed){
    let r = allData.find(d=>d.name===p.name&&!d.retired);
    if(!r){
      const maxNo = Math.max(0,...allData.map(d=>d.no||0));
      r = {no:maxNo+1, name:p.name, part:p.part, job:p.job, size:p.size,
           joinDate:'', history:[today], note:p.note||'', retired:false};
      await dbPut(r);
    } else {
      if(!r.history) r.history=[];
      if(!r.history.includes(today)) r.history.push(today);
      if(p.size) r.size = p.size;
      if(p.part) r.part = p.part;
      if(p.job)  r.job  = p.job;
      await dbPut(r);
    }
  }
  allData = await dbGetAll();

  // 2. 확정 인원 저장 (지급확인서 탭에서 사용)
  window._confirmed = _xlParsed.map(p=>{
    const r = allData.find(d=>d.name===p.name&&!d.retired)||p;
    return {...r, confirmedDate:today};
  });

  renderKPI();
  cancelXl();
  updateNewBadge();
  showToast(`✅ ${window._confirmed.length}명 반영 완료 — 지급확인서 탭으로 이동합니다`);

  // 3. 지급확인서 탭으로 이동해서 확정인원 표시
  setTimeout(()=>switchTab('지급확인서'), 800);
}

function parsePaste(){
  const text=document.getElementById('pasteArea').value.trim();
  if(!text){alert('신청 내역을 붙여넣어 주세요.');return;}
  const lines=text.split('\n').filter(l=>l.trim());
  let added=0,newPeople=[];
  lines.forEach(line=>{
    const parts=line.split(',').map(s=>s.trim());
    if(parts.length<2)return;
    const [name,part,job,size,date]=parts;
    const exists=allData.find(r=>r.name===name&&!r.retired);
    const entry={name,part:part||'DRY',job:job||'',size:size||'',date:date||new Date().toISOString().slice(0,10),isNew:!exists};
    if(!exists)newPeople.push(entry);
    window._pending.push(entry);
    added++;
  });
  updateSizeTable();
  renderPending();
  updateNewBadge();
  if(newPeople.length){
    if(confirm(`신규 인원 ${newPeople.length}명이 감지됐습니다:\n${newPeople.map(p=>p.name).join(', ')}\n\n명부에 추가하시겠습니까?`)){
      newPeople.forEach(p=>openAddModal(p));
    }
  }
  showToast(`✅ ${added}건 취합됨`);
}

function updateSizeTable(){
  const sizeCount={};
  SIZES.concat([295,300]).forEach(s=>sizeCount[s]=0);
  // _xlParsed(미리보기) 또는 _confirmed(확정된것) 기준
  const src = _xlParsed.length ? _xlParsed : (window._confirmed||[]);
  src.forEach(p=>{
    const s=String(p.size||'').replace('mm','').trim();
    if(s && sizeCount[s]!==undefined) sizeCount[s]++;
    else if(s) sizeCount[s]=(sizeCount[s]||0)+1;
  });
  let total=0;
  SIZES.concat([295,300]).forEach(s=>{
    const el=document.getElementById('sz_'+s);
    if(el){el.textContent=sizeCount[s]||0;}
    total+=sizeCount[s]||0;
  });
  const t=document.getElementById('sz_total');
  if(t)t.textContent=total;
}

// ===== 교체주기 =====
function getCycleDay(part){ return part==='WET'?304:365; }
function getCycleLabel(part){ return part==='WET'?'10개월':'12개월'; }

// ===== 대시보드 (첫 페이지) =====
function renderDashboard(){
  const active=allData.filter(r=>!r.retired);
  const today=new Date();
  const todayStr=today.toISOString().slice(0,10);
  const pending=(window._pending||[]).length;

  // 이번달 지급예정 (다음 지급일이 이번달 안에 드는 사람)
  const thisMonth=todayStr.slice(0,7);
  const dueThisMonth=active.filter(r=>{
    const hist=(r.history||[]).slice().sort();
    if(!hist.length)return false;
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+getCycleDay(r.part));
    return next.toISOString().slice(0,7)===thisMonth;
  });

  // 교체임박 90일
  const urgentList=active.filter(r=>{
    const hist=(r.history||[]).slice().sort();
    if(!hist.length)return false;
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+getCycleDay(r.part));
    const dday=Math.ceil((next-today)/(1000*60*60*24));
    return dday<=90;
  });
  const overdue=urgentList.filter(r=>{
    const hist=(r.history||[]).slice().sort();
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+getCycleDay(r.part));
    return next<today;
  });
  const noHist=active.filter(r=>!r.history||!r.history.length);

  // 팀별 인원
  const teamCount={};
  active.forEach(r=>{teamCount[r.part]=(teamCount[r.part]||0)+1;});
  const teamOrder=['DRY','WET','DC','ED','ED-15시','지원'];
  const teamBadge={'DRY':'b-dry','WET':'b-wet','DC':'b-dc','ED':'b-rdc','ED-15시':'b-warn','지원':'b-sup'};

  // 교체주의 카드 (상위 5명)
  const warnCards=urgentList.slice(0,5).map(r=>{
    const hist=(r.history||[]).slice().sort();
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+getCycleDay(r.part));
    const dday=Math.ceil((next-today)/(1000*60*60*24));
    const ddLabel=dday<0?`D+${Math.abs(dday)}일 초과`:dday===0?'오늘!':'D-'+dday+'일';
    const lvColor=dday<0?'var(--red)':dday<=30?'var(--orange)':'var(--amber)';
    const pc=r.part==='WET'?'b-wet':r.part==='DRY'?'b-dry':r.part==='DC'?'b-dc':'b-sup';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
      <div>
        <span class="name-link" onclick="openDetail(${r.no})">${r.name}</span>
        <span class="badge ${pc}" style="margin:0 5px">${r.part}</span>
        <span style="font-size:11px;color:var(--muted)">${r.job} · ${getCycleLabel(r.part)}</span>
      </div>
      <span style="font-size:12px;font-weight:700;color:${lvColor}">${ddLabel}</span>
    </div>`;
  }).join('');

  document.getElementById('tabContent').innerHTML=`
    <div class="two-col" style="margin-bottom:12px">
      <!-- 왼쪽: 인원 현황 -->
      <div class="section">
        <div class="section-title">👥 팀별 인원 현황 <span style="font-size:11px;font-weight:400;color:var(--muted)">(재직 ${active.length}명)</span></div>
        ${teamOrder.filter(t=>teamCount[t]).map(t=>`
          <div class="dept-row">
            <div><span class="badge ${teamBadge[t]||'b-sup'}">${t}</span></div>
            <div style="font-size:13px;font-weight:700">${teamCount[t]}명</div>
          </div>`).join('')}
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn orange" onclick="switchTab('신청접수')">📥 신청접수</button>
          <button class="btn navy" onclick="switchTab('지급확인서')">🖨️ 지급확인서</button>
          <button class="btn" onclick="switchTab('명부')">📋 명부 전체</button>
        </div>
      </div>

      <!-- 오른쪽: 지급 현황 요약 -->
      <div class="section">
        <div class="section-title">📊 지급 현황</div>
        <div class="dept-row"><span style="font-size:12px">이번달 지급예정</span><span style="font-weight:700;color:var(--orange)">${dueThisMonth.length}명</span></div>
        <div class="dept-row"><span style="font-size:12px">교체 초과</span><span style="font-weight:700;color:var(--red)">${overdue.length}명</span></div>
        <div class="dept-row"><span style="font-size:12px">교체임박 (90일이내)</span><span style="font-weight:700;color:var(--amber)">${urgentList.length-overdue.length}명</span></div>
        <div class="dept-row"><span style="font-size:12px">지급이력 없음</span><span style="font-weight:700;color:var(--muted)">${noHist.length}명</span></div>
        <div style="margin-top:10px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:4px">교체주기 기준</div>

      </div>
      ${urgentList.length?warnCards:'<div style="color:var(--muted);font-size:12px;padding:8px">교체임박 대상 없음 ✅</div>'}
    </div>
  `;
}

// ===== 교체주의 탭 =====
function renderWarning(){
  const today=new Date();
  const todayStr=today.toISOString().slice(0,10);
  const active=allData.filter(r=>!r.retired);

  const overdue=[],urgent=[],noHist=[];
  active.forEach(r=>{
    const hist=(r.history||[]).slice().sort();
    if(!hist.length){noHist.push(r);return;}
    const last=new Date(hist[hist.length-1]);
    const next=new Date(last);
    next.setDate(next.getDate()+getCycleDay(r.part));
    const dday=Math.ceil((next-today)/(1000*60*60*24));
    if(dday<0) overdue.push({r,last:hist[hist.length-1],next,dday});
    else if(dday<=90) urgent.push({r,last:hist[hist.length-1],next,dday});
  });
  overdue.sort((a,b)=>a.dday-b.dday);
  urgent.sort((a,b)=>a.dday-b.dday);

  function wRow({r,last,next,dday}){
    const pc=r.part==='WET'?'b-wet':r.part==='DRY'?'b-dry':r.part==='DC'?'b-dc':'b-sup';
    const nextStr=next.toISOString().slice(0,10);
    const ddLabel=dday<0?`D+${Math.abs(dday)}일 초과`:dday===0?'오늘!':'D-'+dday+'일';
    const lvColor=dday<0?'var(--red)':dday<=30?'var(--orange)':'var(--amber)';
    return `<div class="issue-card">
      <div>
        <span class="name-link" onclick="openDetail(${r.no})">${r.name}</span>
        <span class="badge ${pc}" style="margin:0 6px">${r.part}</span>
        <span style="font-size:11px;color:var(--muted)">${r.job} · ${r.size?r.size+'mm':'사이즈미등록'} · ${getCycleLabel(r.part)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)">최근지급: ${last}</span>
        <span style="font-size:12px;color:var(--muted)">다음예정: ${nextStr}</span>
        <span style="font-weight:700;color:${lvColor}">${ddLabel}</span>
      </div>
    </div>`;
  }

  document.getElementById('tabContent').innerHTML=`
    <div class="section">
      <div class="section-title" style="color:var(--red)">🔴 교체 초과 (${overdue.length}명)</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">DRY·DC·ED·지원 12개월 | WET 10개월</div>
      ${overdue.length?overdue.map(wRow).join(''):'<div style="color:var(--muted);font-size:12px;padding:8px">해당 없음 ✅</div>'}
    </div>
    <div class="section" style="margin-top:12px">
      <div class="section-title" style="color:var(--amber)">🟡 교체 임박 — 90일 이내 (${urgent.length}명)</div>
      ${urgent.length?urgent.map(wRow).join(''):'<div style="color:var(--muted);font-size:12px;padding:8px">해당 없음 ✅</div>'}
    </div>
    <div class="section" style="margin-top:12px">
      <div class="section-title">⬜ 지급이력 없음 (${noHist.length}명)</div>
      ${noHist.map(r=>`<div class="issue-card">
        <div>
          <span class="name-link" onclick="openDetail(${r.no})">${r.name}</span>
          <span class="badge ${r.part==='WET'?'b-wet':r.part==='DRY'?'b-dry':r.part==='DC'?'b-dc':'b-sup'}" style="margin:0 6px">${r.part}</span>
          <span style="font-size:11px;color:var(--muted)">${r.job} · ${getCycleLabel(r.part)}</span>
        </div>
        <span style="font-size:12px;color:var(--muted)">입사일: ${r.joinDate||'-'}</span>
      </div>`).join('')||'<div style="color:var(--muted);font-size:12px;padding:8px">전원 지급이력 있음 ✅</div>'}
    </div>
  `;
}

// ===== 저장/불러오기 =====
async function saveData(){
  for(const r of allData) await dbPut(r);
  const blob=new Blob([JSON.stringify(allData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const ym=new Date().getFullYear()+String(new Date().getMonth()+1).padStart(2,'0');
  a.href=url;a.download=`보호구관리대장_백업_${ym}.json`;a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 저장+백업 완료');
}
async function importJSON(input){
  const file=input.files[0];
  if(!file)return;
  const text=await file.text();
  const data=JSON.parse(text);
  for(const r of data) await dbPut(r);
  allData=await dbGetAll();
  renderTab();renderKPI();
  showToast('✅ '+data.length+'건 불러오기 완료');
  input.value='';
}
function exportCSV(){
  const headers=['No','성명','파트','직무','사이즈','입사일','지급이력','비고','퇴사'];
  const rows=allData.map(r=>[r.no,r.name,r.part,r.job,r.size,r.joinDate,(r.history||[]).join(' / '),r.note,r.retired?'Y':'']);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${v||''}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`보호구관리대장_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  URL.revokeObjectURL(url);
}
