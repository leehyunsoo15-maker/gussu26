<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일일 현장 순회점검일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#ff6b35;--navy:#1a2a4a;--bg:#f5f5f3;--card:#fff;
  --border:#ddd;--muted:#888;--text:#1a1a1a;
  --green:#2d7a3a;--red:#c0392b;--amber:#b8680a;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.container{max-width:860px;margin:0 auto;padding:20px}

/* 헤더 */
.doc-header{background:var(--card);border:1.5px solid var(--border);border-radius:10px 10px 0 0;overflow:hidden;display:flex}
.logo-block{background:var(--navy);padding:14px 18px;min-width:120px;display:flex;flex-direction:column;justify-content:center}
.logo-main{color:var(--orange);font-size:18px;font-weight:900;letter-spacing:.5px}
.logo-sub{color:#aab;font-size:10px;margin-top:3px}
.title-block{flex:1;display:flex;align-items:center;justify-content:center;padding:14px}
.doc-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;color:var(--navy)}
.date-block{border-left:1.5px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:6px;min-width:170px;justify-content:center}
.date-row{display:flex;align-items:center;gap:8px}
.date-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;width:42px;flex-shrink:0}
.date-input{border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px;font-family:inherit;color:var(--text);background:#fafafa;width:118px}
.date-input:focus{outline:none;border-color:var(--orange)}

/* 메타 */
.meta-row{background:var(--card);border:1.5px solid var(--border);border-top:none;display:grid;grid-template-columns:52px 1fr 60px 1fr 52px 1fr}
.ml{padding:8px 10px;background:#f8f8f6;font-size:11px;font-weight:700;color:var(--muted);border-right:1px solid var(--border);display:flex;align-items:center}
.mv{padding:8px 10px;border-right:1px solid var(--border);display:flex;align-items:center;gap:5px;font-size:12px}
.mv:last-child{border-right:none}
.mv input[type=text]{border:1px solid var(--border);border-radius:4px;padding:3px 7px;font-size:12px;font-family:inherit;width:100%;background:#fafafa}
.mv input:focus{outline:none;border-color:var(--orange)}
.dept-btn{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#f4f4f2;color:var(--muted);transition:.15s;user-select:none}
.dept-btn.on{background:var(--orange);border-color:var(--orange);color:#fff}

/* 섹션 공통 */
.section{background:var(--card);border:1.5px solid var(--border);border-top:none}
.sec-head{padding:9px 14px;background:var(--navy);color:var(--orange);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-head span{background:var(--orange);color:#fff;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}

/* 체크리스트 */
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.chk-item{padding:11px 14px;border-bottom:1px solid #f0f0ec;border-right:1px solid #f0f0ec;display:flex;gap:10px;align-items:flex-start}
.chk-item:nth-child(even){border-right:none}
.chk-item:nth-last-child(-n+2){border-bottom:none}
.chk-info{flex:1}
.chk-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.chk-desc{font-size:11px;color:var(--muted);line-height:1.4}
.chk-btns{display:flex;gap:4px;flex-shrink:0;margin-top:1px}
.cb{width:32px;height:26px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#f8f8f6;color:var(--muted);transition:.15s;display:flex;align-items:center;justify-content:center}
.cb:hover{background:#eee}
.cb.ok{background:#e8f5e9;border-color:var(--green);color:var(--green)}
.cb.no{background:#fdecea;border-color:var(--red);color:var(--red)}
.cb.na{background:#fff8e1;border-color:var(--amber);color:var(--amber)}

/* 결과 집계 */
.result-bar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--border)}
.rb-cell{padding:10px;text-align:center;border-right:1px solid var(--border)}
.rb-cell:last-child{border-right:none}
.rb-num{font-size:24px;font-weight:900}
.rb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.rb-ok .rb-num{color:var(--green)}
.rb-ok .rb-label{color:var(--green)}
.rb-no .rb-num{color:var(--red)}
.rb-no .rb-label{color:var(--red)}
.rb-na .rb-num{color:var(--amber)}
.rb-na .rb-label{color:var(--amber)}

/* 텍스트 섹션 */
.text-fields{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tf-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.tf-area{width:100%;border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical;min-height:62px;line-height:1.6;color:var(--text);background:#fafafa;transition:.15s}
.tf-area:focus{outline:none;border-color:var(--orange);background:#fff}
.tf-area::placeholder{color:#bbb}

/* 사진 */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px}
.photo-slot{display:flex;flex-direction:column;gap:6px}
.photo-box{border:1.5px dashed var(--border);border-radius:8px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.15s;background:#fafafa;position:relative;overflow:hidden}
.photo-box:hover{border-color:var(--orange);background:#fff8f5}
.photo-box.has-img{border-style:solid;border-color:var(--border)}
.photo-box img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:6px}
.photo-box .ph-icon{font-size:28px;color:#ccc}
.photo-box .ph-txt{font-size:11px;color:#bbb}
.photo-box .ph-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;border-radius:6px}
.photo-box:hover .ph-overlay{display:flex}
.ph-del{color:#fff;font-size:11px;font-weight:700;cursor:pointer;padding:5px 12px;border:1.5px solid #fff;border-radius:20px}
.photo-caption input{border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-size:12px;font-family:inherit;width:100%;background:#fafafa;color:var(--text)}
.photo-caption input:focus{outline:none;border-color:var(--orange)}
.photo-file{display:none}

/* 버튼 */
.btn-row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.btn{padding:10px 24px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.15s}
.btn-save{background:var(--orange);color:#fff}
.btn-save:hover{background:#e55a25}
.btn-print{background:var(--navy);color:#fff}
.btn-print:hover{background:#253f6a}
.btn-reset{background:#f4f4f2;color:var(--muted);border:1px solid var(--border)}
.btn-reset:hover{background:#eee}

/* 인쇄 */
@media print{
  body{background:#fff}
  .container{padding:0;max-width:100%}
  .btn-row{display:none}
  .doc-header{border-radius:0}
  .section:last-child{border-radius:0 0 0 0}
  .cb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .logo-block{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dept-btn.on{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* 마지막 섹션 라운드 */
.section.last{border-radius:0 0 10px 10px}
</style>
</head>
<body>
<div class="container">

  <!-- 헤더 -->
  <div class="doc-header">
    <div class="logo-block">
      <div class="logo-main">E&ONE</div>
      <div class="logo-sub">여주물류센터</div>
      <div class="logo-sub">안전보건팀</div>
    </div>
    <div class="title-block">
      <div class="doc-title">일일 현장 순회점검일지</div>
    </div>
    <div class="date-block">
      <div class="date-row">
        <div class="date-label">점검일</div>
        <input type="date" class="date-input" id="inp-date">
      </div>
      <div class="date-row">
        <div class="date-label">점검자</div>
        <input type="text" class="date-input" id="inp-inspector" value="이현수" placeholder="이름">
      </div>
    </div>
  </div>

  <!-- 메타 -->
  <div class="meta-row">
    <div class="ml">부서</div>
    <div class="mv" id="dept-row">
      <span class="dept-btn" onclick="toggleDept(this,'DRY')">DRY</span>
      <span class="dept-btn" onclick="toggleDept(this,'WET')">WET</span>
      <span class="dept-btn" onclick="toggleDept(this,'ED')">ED</span>
      <span class="dept-btn" onclick="toggleDept(this,'EPS')">EPS</span>
    </div>
    <div class="ml">점검시간</div>
    <div class="mv"><input type="text" id="inp-time" placeholder="09:00 ~ 10:30"></div>
    <div class="ml">날씨</div>
    <div class="mv"><input type="text" id="inp-weather" placeholder="맑음 / 24°C"></div>
  </div>

  <!-- 체크리스트 -->
  <div class="section">
    <div class="sec-head"><span>1</span> 체크리스트 — 안전수칙 준수 현황</div>
    <div class="chk-grid" id="chk-grid"></div>
    <div class="result-bar">
      <div class="rb-cell rb-ok"><div class="rb-num" id="cnt-ok">0</div><div class="rb-label">✓ 양호</div></div>
      <div class="rb-cell rb-no"><div class="rb-num" id="cnt-no">0</div><div class="rb-label">✗ 불량·조치필요</div></div>
      <div class="rb-cell rb-na"><div class="rb-num" id="cnt-na">0</div><div class="rb-label">— 해당없음</div></div>
    </div>
  </div>

  <!-- 특이사항 -->
  <div class="section">
    <div class="sec-head"><span>2</span> 특이사항 및 위험요소</div>
    <div class="text-fields">
      <div>
        <div class="tf-label">발견된 위험요소 / 불량 내용</div>
        <textarea class="tf-area" id="inp-risk" placeholder="발견된 위험요소, 불량 항목 및 구체적 내용을 기재하세요." rows="3"></textarea>
      </div>
      <div>
        <div class="tf-label">조치내용 및 개선계획</div>
        <textarea class="tf-area" id="inp-action" placeholder="즉시조치 내용 및 향후 개선계획을 기재하세요." rows="3"></textarea>
      </div>
      <div>
        <div class="tf-label">기타 특이사항</div>
        <textarea class="tf-area" id="inp-etc" placeholder="기타 전달사항, 공유사항 등을 기재하세요." rows="2"></textarea>
      </div>
    </div>
  </div>

  <!-- 사진 -->
  <div class="section last">
    <div class="sec-head"><span>3</span> 현장 사진</div>
    <div class="photo-grid">
      <div class="photo-slot">
        <div class="photo-box" id="photo-box-0" onclick="triggerUpload(0)">
          <div class="ph-icon">📷</div>
          <div class="ph-txt">클릭하여 사진 추가</div>
          <div class="ph-overlay"><span class="ph-del" onclick="removePhoto(event,0)">삭제</span></div>
        </div>
        <div class="photo-caption"><input type="text" id="photo-cap-0" placeholder="사진 설명 입력..."></div>
        <input type="file" class="photo-file" id="photo-file-0" accept="image/*" onchange="loadPhoto(0)">
      </div>
      <div class="photo-slot">
        <div class="photo-box" id="photo-box-1" onclick="triggerUpload(1)">
          <div class="ph-icon">📷</div>
          <div class="ph-txt">클릭하여 사진 추가</div>
          <div class="ph-overlay"><span class="ph-del" onclick="removePhoto(event,1)">삭제</span></div>
        </div>
        <div class="photo-caption"><input type="text" id="photo-cap-1" placeholder="사진 설명 입력..."></div>
        <input type="file" class="photo-file" id="photo-file-1" accept="image/*" onchange="loadPhoto(1)">
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-reset" onclick="resetForm()">초기화</button>
    <button class="btn btn-print" onclick="window.print()">🖨 인쇄 / PDF</button>
    <button class="btn btn-save" onclick="saveRecord()">💾 저장</button>
  </div>

</div>

<script>
// 체크리스트 항목 정의
const CHK_ITEMS = [
  {name:'지게차·EPT 안전운행 및 점검', desc:'작업 전 점검, 후진 경고음, 동선 분리, 신호수'},
  {name:'컨베이어 안전 이용', desc:'가동 중 점검·청소 금지, 방호장치 확인'},
  {name:'보행자 통로 준수', desc:'지정 보행로 이용, 이동 중 휴대폰 금지'},
  {name:'소방안전 관리', desc:'소화기 위치·상태 확인, 비상구 확보'},
  {name:'인화성물질·전기화재', desc:'인화성물질 보관상태, 전기설비 이상 여부'},
  {name:'작업 전 정리정돈', desc:'통로 정리, 팔레트·자재 지정장소 보관'},
  {name:'스트레칭 실시', desc:'작업 전·중 근골격계 예방 스트레칭'},
  {name:'중량물 작업 안전', desc:'무게 한계 준수, 보조기구 사용, 2인 작업'},
];

// 상태 저장
const state = {}; // {idx: 'ok'|'no'|'na'}

// 렌더
function renderChecklist(){
  const grid = document.getElementById('chk-grid');
  grid.innerHTML = CHK_ITEMS.map((item,i)=>`
    <div class="chk-item">
      <div class="chk-info">
        <div class="chk-name">${item.name}</div>
        <div class="chk-desc">${item.desc}</div>
      </div>
      <div class="chk-btns">
        <div class="cb ${state[i]==='ok'?'ok':''}" onclick="setChk(${i},'ok')" title="양호">✓</div>
        <div class="cb ${state[i]==='no'?'no':''}" onclick="setChk(${i},'no')" title="불량">✗</div>
        <div class="cb ${state[i]==='na'?'na':''}" onclick="setChk(${i},'na')" title="해당없음">—</div>
      </div>
    </div>`).join('');
  updateCount();
}

function setChk(idx, val){
  // 같은 거 다시 클릭하면 해제
  state[idx] = state[idx]===val ? null : val;
  // 불량 선택 시 위험요소란에 자동 추가
  if(val==='no' && state[idx]==='no'){
    const area = document.getElementById('inp-risk');
    const item = CHK_ITEMS[idx].name;
    if(!area.value.includes(item)){
      area.value += (area.value?'\n':'') + '- [불량] '+item+': ';
    }
  }
  renderChecklist();
}

function updateCount(){
  const vals = Object.values(state);
  document.getElementById('cnt-ok').textContent = vals.filter(v=>v==='ok').length;
  document.getElementById('cnt-no').textContent = vals.filter(v=>v==='no').length;
  document.getElementById('cnt-na').textContent = vals.filter(v=>v==='na').length;
}

// 부서
function toggleDept(el, dept){
  el.classList.toggle('on');
}

// 오늘 날짜 자동
function setToday(){
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,'0');
  const d = String(today.getDate()).padStart(2,'0');
  document.getElementById('inp-date').value = `${y}-${m}-${d}`;
}

// 사진
function triggerUpload(idx){
  document.getElementById(`photo-file-${idx}`).click();
}
function loadPhoto(idx){
  const file = document.getElementById(`photo-file-${idx}`).files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const box = document.getElementById(`photo-box-${idx}`);
    box.innerHTML = `<img src="${e.target.result}" alt="현장사진${idx+1}"><div class="ph-overlay"><span class="ph-del" onclick="removePhoto(event,${idx})">삭제</span></div>`;
    box.classList.add('has-img');
  };
  reader.readAsDataURL(file);
}
function removePhoto(e, idx){
  e.stopPropagation();
  const box = document.getElementById(`photo-box-${idx}`);
  box.innerHTML = `<div class="ph-icon">📷</div><div class="ph-txt">클릭하여 사진 추가</div><div class="ph-overlay"><span class="ph-del" onclick="removePhoto(event,${idx})">삭제</span></div>`;
  box.classList.remove('has-img');
  document.getElementById(`photo-file-${idx}`).value='';
}

// 저장 (간단히 알림)
function saveRecord(){
  const date = document.getElementById('inp-date').value;
  if(!date){alert('점검일을 입력하세요');return;}
  const depts = [...document.querySelectorAll('.dept-btn.on')].map(el=>el.textContent).join('·');
  alert(`저장 완료\n점검일: ${date}\n부서: ${depts||'미선택'}\n\n(IndexedDB 저장 기능은 추후 추가 예정)`);
}

// 초기화
function resetForm(){
  if(!confirm('모든 입력 내용을 초기화하시겠습니까?')) return;
  Object.keys(state).forEach(k=>delete state[k]);
  document.querySelectorAll('.dept-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('inp-time').value='';
  document.getElementById('inp-weather').value='';
  ['inp-risk','inp-action','inp-etc'].forEach(id=>document.getElementById(id).value='');
  [0,1].forEach(i=>{removePhoto({stopPropagation:()=>{}},i);document.getElementById(`photo-cap-${i}`).value='';});
  setToday();
  renderChecklist();
}

// 초기 실행
setToday();
renderChecklist();
</script>
</body>
</html>
